# 重要：这份表是本项目自行编制的高频核心词表，按主题组织，**不是官方考纲的照抄**。
# 高考俄语考纲、ТРКИ 官方词表需要另行获取，拿到后与本表比对补齐。
# 在拿到官方词表之前，不要对外声称本表等同于任何考试大纲。
#
# 词元一律不带重音（它们是检索键，与 LexEntry.lemma 对齐）。
# 覆盖率用 `python -m ruassist.coverage` 统计。

