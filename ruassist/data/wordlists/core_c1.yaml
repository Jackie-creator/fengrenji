# C1 扩展词表 —— 第六批撰写目标。
#
# 这一批把词库从 1000 条推到 2000 条，补的是"能读报刊、能写议论"的那一层：
# 抽象名词、过程与变化动词、关系形容词、语篇标记，以及数词与前置词的剩余部分。
# 封闭集合（12–19、60–900、序数词、集合数词、学科名）整组收齐。

