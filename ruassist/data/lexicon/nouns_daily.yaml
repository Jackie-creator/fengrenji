# Everyday scenes: clothing, shopping, the city, communication, leisure.

# --- Clothing ---------------------------------------------------------------

- lemma: рубашка
  stress: руба́шка
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 3*a
  level: [A2, ТРКИ-1]
  form_overrides:
    plur,gent: руба́шек
  senses:
    - zh: 衬衫
      en: shirt
      examples:
        - ru: На нём бе́лая руба́шка.
          zh: 他穿着白衬衫。

- lemma: пальто
  stress: пальто́
  pos: noun
  gender: neut
  animacy: inan
  indeclinable: true
  level: [A2, ТРКИ-1]
