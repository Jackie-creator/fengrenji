- lemma: часы
  stress: часы́
  pos: noun
  gender: masc
  animacy: inan
  number_only: plur
  level: [A2, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: часы́
    plur,gent: часо́в
    plur,datv: часа́м
    plur,accs: часы́
    plur,ablt: часа́ми
    plur,loct: часа́х
  senses:
    - zh: 表，钟
      en: watch, clock
      examples:
        - ru: Мои́ часы́ спеша́т.
          zh: 我的表快了。
  common_errors: |
    "表"这个意思只有复数，与 час（小时）的复数形式完全同形。
    «Часы́ иду́т» 表在走 ／ «пять часо́в» 五点／五小时——靠上下文区分。

