# --- People -----------------------------------------------------------------

- lemma: мужчина
  stress: мужчи́на
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 1a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 男人
      en: man
      examples:
        - ru: Э́тот мужчи́на — мой сосе́д.
          zh: 这个男人是我邻居。
  common_errors: |
    **阳性名词，却按阴性第一变格法变格**：мужчи́ны / мужчи́не / мужчи́ну。
    但修饰它的形容词仍用阳性：«молодо́й мужчи́на»，不是 молода́я。
    同类的还有 па́па、де́душка、дя́дя、ю́ноша。
    形式看着像阴性、语法性别是阳性——这是俄语最容易错的一类词。

