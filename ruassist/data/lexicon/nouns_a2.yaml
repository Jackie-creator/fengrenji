# A2/B1 nouns: seasons, people, places, nature.

# --- Seasons and weather ----------------------------------------------------

- lemma: погода
  stress: пого́да
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 1a
  number_only: sing
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 天气
      en: weather
      examples:
        - ru: Кака́я сего́дня пого́да?
          zh: 今天天气怎么样？

- lemma: весна
  stress: весна́
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 1d
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: вёсны
    plur,gent: вёсен
  senses:
    - zh: 春天
      en: spring
      examples:
        - ru: Весно́й здесь о́чень краси́во.
          zh: 春天这儿很美。
  notes: |
    "在春天"用第五格 весно́й（副词化），不带前置词。
    同组：ле́том 夏天、о́сенью 秋天、зимо́й 冬天——注意 о́сенью 重音在词干。

- lemma: лето
  stress: ле́то
  pos: noun
  gender: neut
  animacy: inan
  zaliznyak: с 1a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 夏天
      en: summer
      examples:
        - ru: Ле́том мы е́здим на мо́ре.
          zh: 夏天我们去海边。
  notes: |
    год 的复数第二格 лет 就是从这个词来的：пять лет。

- lemma: осень
  stress: о́сень
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 8a
  level: [A1, 高考, ТРКИ-1]
