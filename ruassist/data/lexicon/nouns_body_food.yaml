          zh: 我背疼。

# --- Food -------------------------------------------------------------------

- lemma: рыба
  stress: ры́ба
  pos: noun
  gender: femn
  animacy: anim
  zaliznyak: ж 1a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 鱼
      en: fish
      examples:
        - ru: Я не ем ры́бу.
          zh: 我不吃鱼。
  common_errors: |
    ры́ба 在语法上是**动物名词**，所以复数第四格与第二格同形：«лови́ть рыб»。
    单数看不出来（阴性 -а 名词有自己的第四格 ры́бу），只有复数才暴露。

