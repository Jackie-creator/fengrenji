  verify: [zaliznyak]

- lemma: волосы
  stress: во́лосы
  pos: noun
  gender: masc
  animacy: inan
  number_only: plur
  level: [A2, ТРКИ-1]
  form_overrides:
    plur,nomn: во́лосы
    plur,gent: воло́с
    plur,datv: волоса́м
    plur,accs: во́лосы
    plur,ablt: волоса́ми
    plur,loct: волоса́х
  senses:
    - zh: 头发
      en: hair
      examples:
        - ru: У неё дли́нные во́лосы.
          zh: 她头发长。
  common_errors: |
    "头发"日常只用复数。汉语"一根头发"要说单数 во́лос，但说"头发（整体）"必须用复数。
    第三格以下重音移到词尾：волоса́м / волоса́ми。

- lemma: сердце
  stress: се́рдце
  pos: noun
  gender: neut
  animacy: inan
  zaliznyak: с 5c
  level: [A2, ТРКИ-1]
  form_overrides:
    plur,gent: серде́ц
  senses:
    - zh: 心，心脏
      en: heart
      examples:
        - ru: У него́ больно́е се́рдце.
          zh: 他心脏不好。
  common_errors: |
    д 不发音，读作 [се́рце]。
  verify: [zaliznyak]

- lemma: палец
  stress: па́лец
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 5*a
  level: [B1, ТРКИ-1]
  senses:
    - zh: 手指；脚趾
      en: finger, toe
      examples:
        - ru: Я поре́зал па́лец.
          zh: 我把手指割破了。
  common_errors: |
    逃逸元音：па́лец → па́льца / па́льцу。
    俄语不分手指和脚趾，都是 па́лец，要说清楚得加 па́лец руки́／ноги́。

- lemma: спина
  stress: спина́
  pos: noun
