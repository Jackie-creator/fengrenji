# Body parts and food.
#
# Body parts are where Russian's irregular plurals cluster (у́хо -> у́ши,
# глаз -> глаза́), and where Chinese and Russian carve the body up differently.

# --- Body -------------------------------------------------------------------

- lemma: лицо
  stress: лицо́
  pos: noun
  gender: neut
  animacy: inan
  zaliznyak: с 5d
  level: [A2, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: ли́ца
    plur,gent: лиц
  senses:
    - zh: 脸
      en: face
      examples:
        - ru: У неё до́брое лицо́.
          zh: 她面善。
    - zh: 人物；（语法）人称
      en: person
      examples:
        - ru: Глаго́л изменя́ется по ли́цам.
          zh: 动词按人称变化。
  verify: [zaliznyak]

- lemma: ухо
  stress: у́хо
  pos: noun
  gender: neut
  animacy: inan
  level: [A2, ТРКИ-1]
  form_overrides:
    sing,nomn: у́хо
    sing,gent: у́ха
    sing,datv: у́ху
    sing,accs: у́хо
    sing,ablt: у́хом
    sing,loct: у́хе
    plur,nomn: у́ши
    plur,gent: уше́й
    plur,datv: уша́м
    plur,accs: у́ши
    plur,ablt: уша́ми
    plur,loct: уша́х
  senses:
    - zh: 耳朵
      en: ear
      examples:
        - ru: У меня́ боли́т у́хо.
          zh: 我耳朵疼。
  common_errors: |
    复数换了词干：у́хо → у́ши / уше́й（х 变 ш），而且重音移到词尾。
    单数是中性，但复数看起来像阴性——形式上很反直觉，只能整体记。

