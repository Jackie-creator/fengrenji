- lemma: масло
  stress: ма́сло
  pos: noun
  gender: neut
  animacy: inan
  zaliznyak: с 1a
  number_only: sing
  level: [A2, ТРКИ-1]
  senses:
    - zh: 黄油；油
      en: butter, oil
      collocations: [сли́вочное ма́сло, расти́тельное ма́сло]
      examples:
        - ru: Хлеб с ма́слом.
          zh: 抹黄油的面包。
  notes: |
    黄油是 сли́вочное ма́сло，植物油是 расти́тельное ма́сло，单说 ма́сло 通常指黄油。

