# Days of the week and months.
#
# A closed, finite set that a learner needs on day one and that the dictionary
# had no entries for at all. The one real trap is uniform: "on Wednesday" is
# в сре́ду, with the stress retracting off the ending it has in the nominative.

# --- Days -------------------------------------------------------------------

- lemma: понедельник
  stress: понеде́льник
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 3a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 星期一
      en: Monday
      examples:
        - ru: В понеде́льник у нас экза́мен.
          zh: 星期一我们考试。
  common_errors: |
    "在星期几"一律用 **в + 第四格**：в понеде́льник, во вто́рник, в сре́ду。
    星期名称一律小写，不像英语要大写。

- lemma: вторник
  stress: вто́рник
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 3a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 星期二
      en: Tuesday
      examples:
        - ru: Он прие́дет во вто́рник.
          zh: 他星期二到。
  notes: |
    前面的 в 变成 во（辅音丛前）：во вто́рник。

- lemma: среда
  stress: среда́
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 1d
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    sing,accs: сре́ду
    plur,nomn: сре́ды
  senses:
    - zh: 星期三
      en: Wednesday
      examples:
        - ru: В сре́ду я свобо́ден.
          zh: 星期三我有空。
  common_errors: |
    第四格是 **сре́ду**（重音回到词干），所以"在星期三"是 в сре́ду，不是 в среду́。
    与 рука́ → ру́ку 同一个重音例外。

- lemma: четверг
  stress: четве́рг
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 3b
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 星期四
      en: Thursday
      examples:
        - ru: В четве́рг бу́дет собра́ние.
          zh: 星期四开会。
  common_errors: |
    重音在词尾且变格后显现：четверга́ / четвергу́ / четверго́м。

- lemma: пятница
  stress: пя́тница
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 5a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 星期五
      en: Friday
      examples:
        - ru: В пя́тницу мы идём в кино́.
          zh: 星期五我们去看电影。

- lemma: суббота
  stress: суббо́та
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 1a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 星期六
      en: Saturday
      examples:
        - ru: В суббо́ту я отдыха́ю.
          zh: 星期六我休息。

- lemma: воскресенье
  stress: воскресе́нье
  pos: noun
  gender: neut
  animacy: inan
  zaliznyak: с 6a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 星期日
      en: Sunday
      examples:
        - ru: В воскресе́нье мы бы́ли до́ма.
          zh: 星期天我们在家。
  notes: |
    中性名词，第四格与第一格同形，所以"在星期天"就是 в воскресе́нье。

# --- Months -----------------------------------------------------------------
# "In a month" takes в + prepositional, unlike days which take the accusative:
# в январе́, but в понеде́льник. The two sets must be learned apart.

- lemma: январь
  stress: янва́рь
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 2b
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 一月
      en: January
      examples:
        - ru: В январе́ здесь о́чень хо́лодно.
          zh: 一月这儿很冷。
  common_errors: |
    "在某月"用 **в + 第六格**：в январе́（重音在词尾），与星期用第四格不同。
    月份名称一律小写。

- lemma: февраль
