      en: December
      examples:
        - ru: В декабре́ Но́вый год.
          zh: 十二月是新年。
  notes: |
    八个月份名（янва́рь, февра́ль, сентя́брь, октя́брь, ноя́брь, дека́брь）
    都是 -рь 结尾、重音在词尾的阳性名词，可以整组记。

# --- Related time nouns -----------------------------------------------------

- lemma: праздник
  stress: пра́здник
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 3a
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 节日
      en: holiday, festival
      examples:
        - ru: С пра́здником!
          zh: 节日快乐！
  common_errors: |
    д 不发音，读作 [пра́зник]。
    «С пра́здником!» 是万能的节日祝福语，用第五格。

- lemma: каникулы
  stress: кани́кулы
  pos: noun
  gender: femn
  animacy: inan
  number_only: plur
  level: [A2, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: кани́кулы
    plur,gent: кани́кул
    plur,datv: кани́кулам
    plur,accs: кани́кулы
    plur,ablt: кани́кулами
    plur,loct: кани́кулах
  senses:
    - zh: 假期（学校的）
      en: school holidays
      examples:
        - ru: Ле́тние кани́кулы начина́ются в ию́не.
          zh: 暑假六月开始。
  common_errors: |
    只有复数。"放假期间"用 на кани́кулах。
    与 о́тпуск（成年人的休假）分工：学生放假是 кани́кулы，上班的人休假是 о́тпуск。

- lemma: сутки
  stress: су́тки
  pos: noun
  gender: femn
  animacy: inan
  number_only: plur
  level: [B1, ТРКИ-2]
  form_overrides:
    plur,nomn: су́тки
    plur,gent: су́ток
    plur,datv: су́ткам
    plur,accs: су́тки
    plur,ablt: су́тками
    plur,loct: су́тках
  senses:
    - zh: 一昼夜，二十四小时
      en: twenty-four hours
      examples:
        - ru: По́езд идёт дво́е су́ток.
          zh: 火车要走两天两夜。
  notes: |
    只有复数，汉语没有对应的单词。计数要用集合数词：дво́е су́ток, тро́е су́ток。
