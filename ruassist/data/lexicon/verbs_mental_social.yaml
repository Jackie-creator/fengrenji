# Mental processes, social interactions, and states.

- lemma: убедить
  stress: убеди́ть
  pos: verb
  zaliznyak: св 4c
  aspect: perf
  transitivity: trans
  government: кого в чём
  level: [B1, ТРКИ-1]
  aspect_pair: убеждать
  form_overrides:
    futr,1per,sing: убежу́
  senses:
    - zh: 说服了
      en: to convince (once)
      examples:
        - ru: Мне удало́сь убеди́ть его́.
          zh: 我成功说服了他。
  common_errors: '一单将来时是 убежу́（д → ж 交替），不是 *убедю́。'

