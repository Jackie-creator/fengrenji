# --- Abstractions -----------------------------------------------------------

- lemma: дело
  stress: де́ло
  pos: noun
  gender: neut
  animacy: inan
  zaliznyak: с 1c
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 事情，事务
      en: matter, business
      collocations: [как дела́, в чём де́ло]
      examples:
        - ru: Как дела́?
