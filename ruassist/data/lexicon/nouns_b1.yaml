- lemma: любовь
  stress: любо́вь
  pos: noun
  gender: femn
  animacy: inan
  number_only: sing
  level: [A2, 高考, ТРКИ-1]
  form_overrides:
    sing,nomn: любо́вь
    sing,gent: любви́
    sing,datv: любви́
    sing,accs: любо́вь
    sing,ablt: любо́вью
    sing,loct: любви́
  senses:
    - zh: 爱，爱情
      en: love
      collocations: [любо́вь к ро́дине]
      examples:
        - ru: Э́то фильм о любви́.
          zh: 这是部关于爱情的电影。
  common_errors: |
    变格时 о 脱落且重音移到词尾：любо́вь → любви́ / любви́ / любо́вью。
    唯一保留 о 的是第五格 любо́вью。作为人名 Любо́вь 则不脱落（Любо́ви）。

- lemma: радость
  stress: ра́дость
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 8a
  level: [B1, ТРКИ-1]
  senses:
    - zh: 快乐，喜悦
      en: joy
      examples:
        - ru: Э́то была́ больша́я ра́дость.
          zh: 这是件大喜事。
  notes: |
    -ость 结尾的抽象名词全是阴性，全按 ж 8a 变格：ра́дость, но́вость,
    возмо́жность, тру́дность。这一整类可以一次记住。

- lemma: счастье
  stress: сча́стье
  pos: noun
  gender: neut
  animacy: inan
