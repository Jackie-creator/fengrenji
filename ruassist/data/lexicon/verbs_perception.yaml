# Verbs IV: perception and attention, light and sound, the perfective partners
# of everyday imperfectives, and the office/computer layer.
#
# A large share of this batch is по- perfectives (посмотре́ть, поговори́ть).
# They look trivial next to their base verb, but a learner who only knows
# говори́ть cannot produce "поговори́м?" -- the single most common invitation in
# spoken Russian.

