# Verbs II: emotion and relations, speech and argument, work and process,
# household and body care.
#
# Everything here is in a productive class, so the paradigms are generated.
# The one exception is прекрати́ть -> прекращу́, the same т -> щ first person
# singular that защити́ть has; it goes through form_overrides rather than
# being smuggled into the alternation table.

- lemma: представить
