- lemma: заниматься
  stress: занима́ться
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  transitivity: intrans
  reflexive: true
  government: чем
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 从事，做；学习（某科目）
      en: to be occupied with, to study
      collocations: [занима́ться спо́ртом, занима́ться му́зыкой]
      examples:
        - ru: Он занима́ется спо́ртом ка́ждый день.
          zh: 他每天运动。
  common_errors: |
    后面一律接**第五格**：занима́ться спо́ртом / му́зыкой / ру́сским языко́м。
    不能接第四格。这是"用某事占据自己"的逻辑，汉语完全没有对应标记。

