# A2/B1 verbs.
#
# Weighted toward the government patterns Chinese learners get wrong: the
# dative-subject construction (мне нра́вится), and the verbs that demand the
# instrumental where Chinese marks nothing at all.

- lemma: нравиться
  stress: нра́виться
  pos: verb
  zaliznyak: нсв 4a
  aspect: impf
  aspect_pair: понравиться
  transitivity: intrans
  reflexive: true
  government: кому
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 使……喜欢；（某人）喜欢
      en: to please, to be liked by
      examples:
        - ru: Мне нра́вится э́та кни́га.
          zh: 我喜欢这本书。
        - ru: Ей нра́вятся ру́сские пе́сни.
          zh: 她喜欢俄罗斯歌曲。
  common_errors: |
    这是俄语最反直觉的句型之一：**喜欢的人用第三格，被喜欢的东西才是主语**。
    «Мне нра́вится кни́га» 字面是"书使我愉悦"，所以动词跟着 кни́га 变：
    单数 нра́вится，复数 нра́вятся（«Мне нра́вятся кни́ги»）。
    说 «Я нра́влюсь кни́гу» 是彻底错的。
    与 люби́ть 分工：люби́ть 是持久的爱好，нра́виться 偏一时的好感。

