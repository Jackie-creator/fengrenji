# Adjectives: hard vs. soft stems, short forms, suppletive comparatives.

- lemma: большой
  stress: большо́й
  pos: adj
  zaliznyak: п 1b
  short_form: false
  comparative: бо́льше
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 大的
      en: big, large
      collocations: [большо́й го́род, больша́я ко́мната, большо́е спаси́бо]
      examples:
        - ru: Э́то большо́й го́род.
          zh: 这是座大城市。
        - ru: У них больша́я семья́.
          zh: 他们家人多。
  notes: |
    большо́й 没有自己的短尾形式，需要短尾时借用 вели́кий 的：
    вели́к / велика́ / велико́ / велики́，而且意思偏向"（对某人来说）太大了"：
    «Э́ти ту́фли мне велики́» 这双鞋我穿太大了。
  common_errors: |
    比较级 бо́льше 同时是 мно́го 的比较级，一形两用：
    «Он бо́льше меня́» 他比我高大 / «У меня́ бо́льше книг» 我书更多。
    注意与 бо́лее（更加，用于构成分析式比较级）区分。
  antonyms: [маленький]

- lemma: хороший
  stress: хоро́ший
  pos: adj
  zaliznyak: п 4a
  short_form: true
  comparative: лу́чше
  superlative: лу́чший
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 好的
      en: good
      collocations: [хоро́ший челове́к, хоро́шая пого́да, всего́ хоро́шего]
      examples:
        - ru: Э́то хоро́шая иде́я.
          zh: 这是个好主意。
        - ru: Сего́дня хоро́шая пого́да.
          zh: 今天天气不错。
  common_errors: |
    比较级 лу́чше 和最高级 лу́чший 都是补充形式，与词根 хорош- 毫无关系，
    不能说 хоро́шее。副词 хорошо́ 的比较级同样是 лу́чше：
    «Он говори́т лу́чше меня́» 他说得比我好。
  notes: |
    短尾形式 хоро́ш / хороша́ / хорошо́ / хороши́，阴性重音移到词尾。
    短尾常用于评价具体场合：«Она́ сего́дня хороша́» 她今天真好看。
  antonyms: [плохой]

- lemma: русский
  stress: ру́сский
  pos: adj
  zaliznyak: п 3a*
  short_form: false
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 俄罗斯的，俄语的
      en: Russian
      collocations: [ру́сский язы́к, ру́сская культу́ра, ру́сская литерату́ра]
      examples:
        - ru: Я изуча́ю ру́сский язы́к.
          zh: 我学俄语。
    - zh: 俄罗斯人（名词用法）
      en: a Russian
      examples:
        - ru: Он ру́сский, а она́ кита́янка.
          zh: 他是俄罗斯人，她是中国人。
  notes: |
    ру́сский 既是形容词也可以直接当名词用（ру́сский 俄罗斯男人 / ру́сская 俄罗斯女人），
    作名词时仍按形容词变格：ви́жу ру́сского。这类"形容词性名词"还有
    столо́вая（食堂）、больно́й（病人）、моро́женое（冰淇淋）。
  common_errors: |
    必须区分三种说法：
    ру́сский язы́к（俄语，形容词 + 名词，作宾语用）；
    по-ру́сски（用俄语，副词，跟 говори́ть / чита́ть 连用）；
    Росси́я / росси́йский（俄罗斯国家的，指国籍和国家，与民族义的 ру́сский 不同）。

- lemma: синий
  stress: си́ний
  pos: adj
  zaliznyak: п 4a
  short_form: true
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 蓝色的，深蓝的
      en: blue, dark blue
      collocations: [си́нее не́бо, си́нее мо́ре]
      examples:
        - ru: На ней си́нее пла́тье.
          zh: 她穿着一条蓝裙子。
  notes: |
    软变化形容词，词尾全部是软的：си́ний / си́няя / си́нее / си́ние，
    与硬变化 но́вый / но́вая / но́вое / но́вые 成对照。
    软变化形容词数量不多但都高频：си́ний, ле́тний, после́дний, дома́шний, сосе́дний。
  common_errors: |
    俄语的"蓝"分两个词：си́ний 指深蓝，голубо́й 指浅蓝／天蓝。
    汉语一个"蓝"字对应两个俄语词，翻译时必须判断深浅。
    汉译俄说"蓝天"要用 голубо́е не́бо，不是 си́нее не́бо。

- lemma: маленький
  stress: ма́ленький
  pos: adj
  zaliznyak: п 3a*
  short_form: true
  comparative: ме́ньше
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 小的
      en: small, little
      collocations: [ма́ленький ребёнок, ма́ленькая ко́мната]
      examples:
        - ru: У них ма́ленькая кварти́ра.
          zh: 他们的房子很小。
  notes: |
    短尾是 мал / мала́ / мало́ / малы́（不是 ма́ленек），
    而且短尾意思变成"（对某人来说）太小了"：
    «Э́ти ту́фли мне малы́» 这双鞋我穿太小了。
  common_errors: |
    比较级 ме́ньше 是补充形式，同时也是 ма́ло 的比较级，与 бо́льше 完全对称。
  antonyms: [большой]
