# Grammar and language study; speech acts; feelings; classification.
#
# The grammatical terms are here so that the app can explain itself: a learner
# reading "第四格" in a note should be able to look up падеж and винительный.
# The speech-act nouns (про́сьба, отка́з, разреше́ние) pair with the verbs
# already in the lexicon and carry the same case government.

- lemma: алфавит
  stress: алфави́т
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 字母表
      en: alphabet
      examples:
        - ru: В ру́сском алфави́те три́дцать три бу́квы.
          zh: 俄语字母表有三十三个字母。

- lemma: буква
  stress: бу́ква
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 1a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 字母
      en: letter (of the alphabet)
      examples:
        - ru: Э́то бу́ква «ж».
          zh: 这是字母 ж。
  common_errors: |
    бу́ква 是字母，письмо́ 是书信。汉语的"信"和"字母"不会混，
    但英语 letter 的干扰会让人用错。

