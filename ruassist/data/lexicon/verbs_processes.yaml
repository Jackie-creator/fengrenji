# Verbs III: processes and change, states of body and mood, social routine,
# management and rules.
#
# Reflexive/non-reflexive pairs are collected together (меня́ть / меня́ться,
# улучша́ть / улучша́ться) because that alternation -- "X changes Y" vs. "X
# changes" -- is how Russian does the intransitive, and Chinese does not mark
# it at all.

- lemma: получиться
  stress: получи́ться
  pos: verb
  zaliznyak: св 4c
  aspect: perf
  aspect_pair: получаться
  transitivity: intrans
  reflexive: true
  level: [B1, ТРКИ-2]
  senses:
    - zh: 成功，弄成
      en: to turn out, to work out
      examples:
        - ru: У меня́ не получи́лось.
          zh: 我没弄成。
  common_errors: |
    做成事的人用第二格 у кого：У меня́ получи́лось。
    汉语的主语在俄语里变成了 у + 第二格，句子的主语是"事情"。

