      en: animal
      examples:
        - ru: Она́ лю́бит живо́тных.
          zh: 她喜欢动物。
  common_errors: |
    живо́тное 是形容词变来的名词，按**形容词**变格：живо́тного、живо́тным。
    虽然是动物名词，单数第四格仍与第一格同形（中性），只有复数才用第二格 живо́тных。

