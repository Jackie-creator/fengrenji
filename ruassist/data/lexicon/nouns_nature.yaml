# Nature: landscape, weather, plants, animals, points of the compass.
#
# Two entries carry hand-written plurals because the paradigm cannot reach
# them: звезда́ -> звёзды (the ё is not derivable from the singular) and
# живо́тное, which is an adjective pressed into service as a noun and declines
# like one. Everything else is generated.

- lemma: природа
  stress: приро́да
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 1a
  number_only: sing
  level: [B1, ТРКИ-1]
  senses:
    - zh: 大自然；本性
      en: nature
      examples:
        - ru: Мы отдыха́ли на приро́де.
          zh: 我们在郊外休息。
  notes: |
    на приро́де = 到野外、郊外（不是"在自然界"），是很日常的说法。

