- lemma: животное
  stress: живо́тное
  pos: noun
  gender: neut
  animacy: anim
  level: [B1, ТРКИ-1]
  form_overrides:
    sing,nomn: живо́тное
    sing,gent: живо́тного
    sing,datv: живо́тному
    sing,accs: живо́тное
    sing,ablt: живо́тным
    sing,loct: живо́тном
    plur,nomn: живо́тные
    plur,gent: живо́тных
    plur,datv: живо́тным
    plur,accs: живо́тных
    plur,ablt: живо́тными
    plur,loct: живо́тных
  senses:
