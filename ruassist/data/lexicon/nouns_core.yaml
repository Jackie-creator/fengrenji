# Core A1 nouns: time, family, home, study, city, food.

# --- Time -------------------------------------------------------------------

- lemma: день
  stress: день
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 2*b
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 天，白天
      en: day
      collocations: [ка́ждый день, до́брый день, весь день]
      examples:
        - ru: До́брый день!
          zh: 您好（白天问候）！
        - ru: Он рабо́тает це́лый день.
          zh: 他干了一整天。
  common_errors: |
    逃逸元音 е 一变格就脱落：день → дня / дню / днём / дне，复数 дни / дней。

- lemma: ночь
  stress: ночь
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 8e
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 夜，夜里
      en: night
      collocations: [споко́йной но́чи, всю ночь]
      examples:
        - ru: Споко́йной но́чи!
          zh: 晚安！
  common_errors: |
    "晚安"是 «Споко́йной но́чи»，用第二格（省略了"祝您……"）。
    同类还有 «До́брого пути́» 一路平安。

- lemma: утро
  stress: у́тро
  pos: noun
  gender: neut
  animacy: inan
  zaliznyak: с 1a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 早晨，上午
      en: morning
      collocations: [до́брое у́тро, у́тром]
      examples:
        - ru: До́брое у́тро!
          zh: 早上好！
  notes: |
    "在早上"用第五格 у́тром（副词化）。同组：днём 白天、ве́чером 晚上、но́чью 夜里。
    这套时间副词都是第五格固化来的，不带前置词。

- lemma: вечер
  stress: ве́чер
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1c(1)
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 傍晚，晚上；晚会
      en: evening
      collocations: [до́брый ве́чер, ве́чером]
      examples:
        - ru: До́брый ве́чер!
          zh: 晚上好！
  common_errors: |
    复数是 вечера́（重音在词尾），与 го́род → города́ 同型。

- lemma: год
  stress: год
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1c(1)
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,gent: лет
    sing,loc2: году́
  senses:
    - zh: 年
      en: year
      collocations: [в э́том году́, ка́ждый год, Но́вый год]
      examples:
        - ru: В э́том году́ я начала́ изуча́ть ру́сский язы́к.
          zh: 今年我开始学俄语了。
        - ru: Ему́ два́дцать лет.
          zh: 他二十岁。
  common_errors: |
    复数第二格是补充形式 лет（来自 ле́то），不是 годо́в：
    два го́да（2–4 用单数第二格）／ пять лет（5 以上用 лет）。
    说年龄一律用这套：«Ему́ два́дцать лет»，而且人用第三格。
    另外"在今年"用处所格 в году́，不是 в го́де。

- lemma: месяц
  stress: ме́сяц
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 5a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 月，月份
      en: month
      examples:
        - ru: Я живу́ здесь три ме́сяца.
          zh: 我在这儿住了三个月。

- lemma: неделя
  stress: неде́ля
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 2a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 星期，周
      en: week
      collocations: [на про́шлой неде́ле, на э́той неде́ле]
      examples:
        - ru: На э́той неде́ле я о́чень за́нят.
          zh: 这周我很忙。
  common_errors: |
    "在某周"用 на + 第六格（на э́той неде́ле），不是 в。
    但"在某月／某年"用 в：в ма́е, в э́том году́。前置词要分开记。

- lemma: час
  stress: час
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1c
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    sing,loc2: часу́
  senses:
    - zh: 小时；点钟
      en: hour, o'clock
      collocations: [кото́рый час, че́рез час]
      examples:
        - ru: Уро́к начина́ется в два часа́.
          zh: 两点开始上课。
        - ru: Я ждал вас пять часо́в.
          zh: 我等了您五个小时。
  common_errors: |
    数词后形式是高频考点，而且 2–4 之后的 часа́ 重音在词尾：
    оди́н час / два часа́ / пять часо́в。
    问时间说 «Кото́рый час?» 或口语 «Ско́лько вре́мени?»。

- lemma: минута
  stress: мину́та
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 1a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 分钟
      en: minute
      examples:
        - ru: Подожди́те мину́ту, пожа́луйста.
          zh: 请等一分钟。

# --- Family and people ------------------------------------------------------

- lemma: семья
  stress: семья́
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 2*b
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: се́мьи
    plur,gent: семе́й
    plur,datv: се́мьям
  senses:
    - zh: 家庭，一家人
      en: family
      examples:
        - ru: У нас больша́я семья́.
          zh: 我们家人多。

- lemma: отец
  stress: оте́ц
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 5*b
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 父亲
      en: father
      examples:
        - ru: Мой оте́ц рабо́тает инжене́ром.
          zh: 我父亲是工程师。
  common_errors: |
    逃逸元音 е 脱落：оте́ц → отца́ / отцу́ / отцо́м / отце́，重音也移到词尾。
    口语里"爸爸"更常说 па́па（虽然是阳性，但按阴性变格法变化）。

- lemma: сын
  stress: сын
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 1a
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: сыновья́
    plur,gent: сынове́й
    plur,datv: сыновья́м
    plur,accs: сынове́й
    plur,ablt: сыновья́ми
    plur,loct: сыновья́х
  senses:
    - zh: 儿子
      en: son
      examples:
        - ru: У них два сы́на.
          zh: 他们有两个儿子。
  common_errors: |
    复数是特殊形式 сыновья́ / сынове́й，不是 сы́ны（那是"祖国的儿子"这类修辞用法）。

- lemma: брат
  stress: брат
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 1a
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: бра́тья
    plur,gent: бра́тьев
    plur,datv: бра́тьям
    plur,accs: бра́тьев
    plur,ablt: бра́тьями
    plur,loct: бра́тьях
  senses:
    - zh: 哥哥，弟弟
      en: brother
      examples:
        - ru: Мой ста́рший брат живёт в Москве́.
          zh: 我哥哥住在莫斯科。
  notes: |
    与 сестра́ 一样不分长幼，要说清楚得加 ста́рший（哥）／ мла́дший（弟）。
  common_errors: |
    复数 бра́тья / бра́тьев 是 -ья 型特殊复数。同型的还有 стул → сту́лья、
    друг → друзья́、сын → сыновья́。这一组要整批记。

- lemma: муж
  stress: муж
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 4a
  level: [A1, ТРКИ-1]
  form_overrides:
    plur,nomn: мужья́
    plur,gent: муже́й
    plur,datv: мужья́м
  senses:
    - zh: 丈夫
      en: husband
      examples:
        - ru: Её муж — врач.
          zh: 她丈夫是医生。

- lemma: жена
  stress: жена́
  pos: noun
  gender: femn
  animacy: anim
  zaliznyak: ж 1d
  level: [A1, ТРКИ-1]
  form_overrides:
    plur,nomn: жёны
    plur,gent: жён
    plur,datv: жёнам
  senses:
    - zh: 妻子
      en: wife
      examples:
        - ru: Его́ жена́ рабо́тает в шко́ле.
          zh: 他妻子在学校工作。
  common_errors: |
    复数出现 ё：жёны / жён，与 сестра́ → сёстры 同型。

- lemma: друг
  stress: друг
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 3a
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: друзья́
    plur,gent: друзе́й
    plur,datv: друзья́м
    plur,accs: друзе́й
    plur,ablt: друзья́ми
    plur,loct: друзья́х
  senses:
    - zh: 朋友
      en: friend
      examples:
        - ru: Он мой лу́чший друг.
          zh: 他是我最好的朋友。
        - ru: Я иду́ в кино́ с друзья́ми.
          zh: 我和朋友们去看电影。
  common_errors: |
    复数完全变形：друзья́ / друзе́й / друзья́м，г 变成 з。
    女性朋友用 подру́га，复数正常：подру́ги。

- lemma: студент
  stress: студе́нт
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 1a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 大学生
      en: student
      examples:
        - ru: Я студе́нт второ́го ку́рса.
          zh: 我是二年级学生。
  notes: |
    只指大学生。中小学生是 шко́льник / учени́к。汉语"学生"覆盖面更宽。
    女生用 студе́нтка。

- lemma: преподаватель
  stress: преподава́тель
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 2a
  level: [A1, ТРКИ-1]
  senses:
    - zh: （大学）教师
      en: teacher, lecturer
      examples:
        - ru: Наш преподава́тель говори́т о́чень бы́стро.
          zh: 我们老师说话很快。

- lemma: учитель
  stress: учи́тель
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 2a
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: учителя́
    plur,gent: учителе́й
    plur,datv: учителя́м
  senses:
    - zh: （中小学）教师
      en: teacher
      examples:
        - ru: Она́ рабо́тает учи́телем.
          zh: 她当老师。
  common_errors: |
    复数 учителя́ 重音在词尾。与 преподава́тель（大学教师，复数规则 преподава́тели）分工不同。

