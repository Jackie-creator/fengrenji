# --- Body and money ---------------------------------------------------------

- lemma: глаз
  stress: глаз
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1c(1)
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: глаза́
    plur,gent: глаз
    sing,loc2: глазу́
  senses:
    - zh: 眼睛
      en: eye
      examples:
        - ru: У неё краси́вые глаза́.
          zh: 她眼睛很好看。
  common_errors: |
    复数第二格是零词尾 глаз，与单数第一格同形：«пять глаз»。
    复数第一格 глаза́ 重音在词尾。

- lemma: деньги
  stress: де́ньги
  pos: noun
  gender: femn
  animacy: inan
  number_only: plur
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: де́ньги
    plur,gent: де́нег
    plur,datv: деньга́м
    plur,accs: де́ньги
    plur,ablt: деньга́ми
    plur,loct: деньга́х
  senses:
    - zh: 钱
      en: money
      examples:
        - ru: У меня́ нет де́нег.
          zh: 我没钱。
  common_errors: |
    деньги 只有复数（复数形式名词），没有单数，谓语一律用复数：
    «Де́ньги лежа́т на столе́»。
    同类只有复数的词还有 часы́（表）、очки́（眼镜）、но́жницы（剪刀）、брю́ки（裤子）。
    另外第三格以下重音移到词尾：деньга́м / деньга́ми / деньга́х。
