# The built world: media and technology, transport, the city, the flat.
#
# Concrete nouns, so the entries are short. The teaching notes are reserved
# for the handful where Chinese and Russian carve the world differently --
# зна́к vs. си́мвол, дом as "building" vs. "home", вход/выход as a pair.

