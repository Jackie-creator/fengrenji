- lemma: приезжать
  stress: приезжа́ть
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  aspect_pair: приехать
  transitivity: intrans
  government: куда / к кому
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: （乘车）到达，来
      en: to arrive (by vehicle)
      examples:
        - ru: Он ча́сто приезжа́ет к нам.
          zh: 他常来我们这儿。
  common_errors: |
    与 приходи́ть 的分工与 идти́／е́хать 一致：步行来用 приходи́ть，
    乘车／坐飞机来用 приезжа́ть。
  antonyms: [уезжать]

