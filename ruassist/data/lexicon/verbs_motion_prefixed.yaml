- lemma: заходить
  stress: заходи́ть
  pos: verb
  zaliznyak: нсв 4c
  aspect: impf
  aspect_pair: зайти
  transitivity: intrans
  government: к кому / куда
  level: [B1, ТРКИ-1]
  senses:
    - zh: 顺路去，串门
      en: to drop in
      examples:
        - ru: Заходи́ ко мне ве́чером.
          zh: 晚上到我这儿来坐坐。
  notes: |
    前缀 за- 表示"顺便、短暂地去一下"，是拜访朋友最常用的说法。
    "去某人家"用 к + 第三格：зайти́ к дру́гу。

