# Prefixed motion verbs.
#
# The single largest structural gap left in the lexicon and the point where most
# learners stall. Russian builds a whole system out of one root: the prefix says
# the direction, and the imperfective/perfective pair still has to be chosen on
# top of that. Chinese expresses all of it with 进/出/过/到 plus 去, so nothing
# in the source language forces the distinction.
#
# All the -йти perfectives share one paradigm: -йду́ / -йдёшь, past -шёл / -шла́,
# built on the same suppletive stem as идти́.

- lemma: входить
  stress: входи́ть
  pos: verb
  zaliznyak: нсв 4c
  aspect: impf
  aspect_pair: войти
  transitivity: intrans
  government: во что / куда
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 走进，进入
      en: to enter
      examples:
        - ru: Он вхо́дит в ко́мнату.
          zh: 他走进房间。
  common_errors: |
    "进入某处"用 в + 第四格：войти́ в дом。
  antonyms: [выходить]

- lemma: войти
  stress: войти́
  pos: verb
  aspect: perf
  aspect_pair: входить
  transitivity: intrans
  government: во что / куда
  level: [A2, 高考, ТРКИ-1]
  form_overrides:
    futr,1per,sing: войду́
    futr,2per,sing: войдёшь
    futr,3per,sing: войдёт
    futr,1per,plur: войдём
    futr,2per,plur: войдёте
    futr,3per,plur: войду́т
    past,masc: вошёл
    past,femn: вошла́
    past,neut: вошло́
    past,plur: вошли́
    impr,sing: войди́
    impr,plur: войди́те
  senses:
    - zh: 走进去了（完成体）
      en: to enter
      examples:
        - ru: Войди́те!
          zh: 请进！
  common_errors: |
    过去时是 вошёл / вошла́——й 在过去时消失，与不定式 войти́ 对不上，必须单记。

- lemma: выходить
  stress: выходи́ть
  pos: verb
  zaliznyak: нсв 4c
  aspect: impf
  aspect_pair: выйти
  transitivity: intrans
  government: из чего / куда
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 走出，出来；下车
      en: to go out, to get off
      examples:
        - ru: Вы выхо́дите на сле́дующей?
          zh: 您下一站下车吗？
  notes: |
    «Вы выхо́дите?» 是在拥挤的公交车上挤到门口的固定用语。
  antonyms: [входить]

- lemma: выйти
  stress: вы́йти
  pos: verb
  aspect: perf
  aspect_pair: выходить
  transitivity: intrans
  government: из чего / куда
  level: [A2, 高考, ТРКИ-1]
  form_overrides:
    futr,1per,sing: вы́йду
    futr,2per,sing: вы́йдешь
    futr,3per,sing: вы́йдет
    futr,1per,plur: вы́йдем
    futr,2per,plur: вы́йдете
    futr,3per,plur: вы́йдут
    past,masc: вы́шел
    past,femn: вы́шла
    past,neut: вы́шло
    past,plur: вы́шли
    impr,sing: вы́йди
    impr,plur: вы́йдите
  senses:
    - zh: 走出去了（完成体）
      en: to go out
      examples:
        - ru: Он вы́шел из до́ма в семь.
          zh: 他七点出的门。
  common_errors: |
    前缀 вы- 在完成体里**夺走重音**：вы́йти / вы́йду / вы́шел，
    而未完成体 выходи́ть 重音在词尾。同型的还有 вы́брать、вы́учить、вы́пить。
    另外"从某处出来"用 из + 第二格：вы́йти из до́ма。

