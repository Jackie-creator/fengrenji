    impr,sing: приезжа́й
    impr,plur: приезжа́йте
  senses:
    - zh: （乘车）到了（完成体）
      en: to arrive
      examples:
        - ru: Он прие́хал из Кита́я.
          zh: 他从中国来的。
  common_errors: |
    命令式借用未完成体的形式：приезжа́й(те)，不能说 «прие́хай»。
    与 е́хать → поезжа́й 是同一个补充现象。

