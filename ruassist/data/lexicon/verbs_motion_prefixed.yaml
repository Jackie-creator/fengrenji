- lemma: поехать
  stress: пое́хать
  pos: verb
  aspect: perf
  transitivity: intrans
  motion_group: prefixed
  government: куда
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    futr,1per,sing: пое́ду
    futr,2per,sing: пое́дешь
    futr,3per,sing: пое́дет
    futr,1per,plur: пое́дем
    futr,2per,plur: пое́дете
    futr,3per,plur: пое́дут
    past,masc: пое́хал
    past,femn: пое́хала
    past,neut: пое́хало
    past,plur: пое́хали
    impr,sing: поезжа́й
    impr,plur: поезжа́йте
  senses:
