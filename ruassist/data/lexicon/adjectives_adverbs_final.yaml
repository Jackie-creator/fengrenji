# The last round: evaluative and character adjectives, plus the discourse
# adverbs and particles that hold written Russian together (во-пе́рвых,
# сле́довательно, впро́чем).
#
# Discourse markers are worth entries of their own: a learner who knows every
# content word in a paragraph can still lose the thread without them.

- lemma: художественный
  stress: худо́жественный
  pos: adj
  zaliznyak: п 1*a
  level: [B2, ТРКИ-3]
  senses:
