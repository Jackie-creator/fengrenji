- lemma: вдвоём
  stress: вдвоём
  pos: adv
  level: [B1, ТРКИ-2]
  senses:
    - zh: 两个人一起
      en: the two of us/them together
      examples:
        - ru: Мы бы́ли там вдвоём.
          zh: 我们俩一起去的。

- lemma: потихоньку
  stress: потихо́ньку
  pos: adv
  level: [B2, ТРКИ-3]
  senses:
    - zh: 慢慢地；悄悄地
      en: slowly; quietly
      labels: [разг.]
      examples:
        - ru: Де́ло идёт потихо́ньку.
          zh: 事情慢慢在推进。

- lemma: заранее
  stress: зара́нее
  pos: adv
  level: [B1, ТРКИ-2]
  senses:
    - zh: 事先，提前
      en: in advance
      examples:
        - ru: Купи́ биле́ты зара́нее.
          zh: 提前把票买了。

- lemma: наконец-то
  stress: наконе́ц-то
  pos: adv
  level: [B2, ТРКИ-2]
  senses:
    - zh: 总算，可算是
      en: at last, finally
      examples:
        - ru: Наконе́ц-то ты пришёл!
          zh: 你可算来了！
  notes: |
    比 наконе́ц 多一层"等得不耐烦"的情绪，是口语里的常用形式。

- lemma: пожалуй
  stress: пожа́луй
  pos: part
  level: [B2, ТРКИ-2]
  senses:
    - zh: 也许，我看是（表示斟酌后的判断）
      en: perhaps, I'd say
      examples:
        - ru: Пожа́луй, ты прав.
          zh: 我看你说得对。

- lemma: вроде
  stress: вро́де
  pos: part
  level: [B2, ТРКИ-3]
  senses:
    - zh: 好像，似乎（口语）
      en: sort of, seemingly
      labels: [разг.]
      examples:
        - ru: Он вро́де согла́сен.
          zh: 他好像是同意了。

- lemma: обязательно
  stress: обяза́тельно
  pos: adv
  homonym_id: 2
  level: [B2, ТРКИ-2]
  senses:
    - zh: 未必（用于否定："не обяза́тельно"）
      en: not necessarily (in negation)
      examples:
        - ru: Э́то не обяза́тельно так.
          zh: 未必是这样。
  notes: |
    这一条收 не обяза́тельно = "未必"的用法；肯定的"一定"是另一条词条。

- lemma: приблизительно
  stress: приблизи́тельно
  pos: adv
  level: [B2, ТРКИ-3]
  senses:
    - zh: 大约，大致
      en: approximately
      examples:
        - ru: Э́то приблизи́тельно сто ме́тров.
          zh: 这大概一百米。
  synonyms: [примерно]

- lemma: целиком
  stress: целико́м
  pos: adv
  level: [B2, ТРКИ-3]
  senses:
    - zh: 整个地，全部
      en: entirely, as a whole
      examples:
        - ru: Он проглоти́л я́блоко целико́м.
          zh: 他把苹果整个吞了下去。

- lemma: частично
  stress: части́чно
  pos: adv
  level: [B2, ТРКИ-3]
  senses:
    - zh: 部分地
      en: partly
      examples:
        - ru: Он части́чно прав.
          zh: 他说得有一部分对。

- lemma: постепенно
  stress: постепе́нно
  pos: adv
  level: [B2, ТРКИ-2]
  senses:
    - zh: 逐渐地
      en: gradually
      examples:
        - ru: Он постепе́нно привы́к.
          zh: 他慢慢习惯了。

- lemma: сразу же
  stress: сра́зу же
  pos: adv
  level: [B2, ТРКИ-2]
  senses:
    - zh: 立刻就
      en: right away
      examples:
        - ru: Он сра́зу же отве́тил.
          zh: 他立刻就回了。
  notes: |
    же 在这里只加强语气，本身不重读，也不能单独使用。

- lemma: то есть
  stress: то есть
  pos: conj
  level: [B2, ТРКИ-2]
  senses:
    - zh: 也就是说
      en: that is, i.e.
      examples:
        - ru: За́втра, то есть в сре́ду.
          zh: 明天，也就是星期三。

- lemma: например
  stress: наприме́р
  pos: adv
  homonym_id: 2
  level: [B2, ТРКИ-2]
  senses:
    - zh: 比方说（引出假设）
      en: say, for instance
      examples:
        - ru: Возьми́ что́-нибудь, наприме́р, кни́гу.
          zh: 随便拿点什么，比方说本书。
  notes: |
    这一条收"引出假设"的用法；举实例的 наприме́р 是另一条词条。

- lemma: вообще-то
  stress: вообще́-то
  pos: adv
  level: [B2, ТРКИ-2]
  senses:
    - zh: 其实，说实话（口语）
      en: actually, in fact
      labels: [разг.]
      examples:
        - ru: Вообще́-то я за́нят.
          zh: 其实我挺忙的。

- lemma: тем не менее
  stress: тем не ме́нее
  pos: conj
  level: [B2, ТРКИ-3]
  senses:
    - zh: 尽管如此
      en: nevertheless
      examples:
        - ru: Бы́ло тру́дно, тем не ме́нее мы спра́вились.
          zh: 虽然难，我们还是做成了。

- lemma: в самом деле
  stress: в са́мом де́ле
  pos: adv
  level: [B2, ТРКИ-3]
  senses:
    - zh: 的确，真的
      en: indeed, really
      examples:
        - ru: Он в са́мом де́ле уе́хал.
          zh: 他真的走了。

- lemma: судя по
  stress: су́дя по
  pos: prep
  government: чему
  level: [B2, ТРКИ-3]
  senses:
    - zh: 从……来看
      en: judging by
      examples:
        - ru: Су́дя по пого́де, бу́дет дождь.
          zh: 看天气要下雨。

- lemma: несмотря на
  stress: несмотря́ на
  pos: prep
  government: что
  level: [B2, ТРКИ-2]
  senses:
    - zh: 尽管，不顾
      en: in spite of, despite
      examples:
        - ru: Он пришёл, несмотря́ на дождь.
          zh: 尽管下雨他还是来了。
  common_errors: |
    несмотря́ на 带第四格；不要跟 не смотря́（副动词"没看"）混淆，
    后者分写，意思完全不同。

- lemma: по-моему
  stress: по-мо́ему
  pos: adv
  level: [B1, ТРКИ-1]
  senses:
    - zh: 我看，我认为
      en: in my opinion
      examples:
        - ru: По-мо́ему, э́то хоро́шая иде́я.
          zh: 我看这主意不错。
  notes: |
    同一套还有 по-тво́ему、по-ва́шему、по-его́ 不用（只能说 по его́ мне́нию）。

- lemma: по-русски
  stress: по-ру́сски
  pos: adv
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 用俄语；按俄国方式
      en: in Russian
      examples:
        - ru: Он говори́т по-ру́сски.
          zh: 他说俄语。
  common_errors: |
    "说某种语言"用 по-ру́сски（副词），不用 на ру́сском языке́ 以外的形式；
    但"用俄语写的书"是 кни́га на ру́сском языке́。

- lemma: по-китайски
  stress: по-кита́йски
  pos: adv
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 用汉语
      en: in Chinese
      examples:
        - ru: Как э́то бу́дет по-кита́йски?
          zh: 这个用汉语怎么说？

- lemma: по-английски
  stress: по-англи́йски
  pos: adv
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 用英语
      en: in English
      examples:
        - ru: Она́ чита́ет по-англи́йски.
          zh: 她能读英文。

- lemma: по-другому
  stress: по-друго́му
  pos: adv
  level: [B2, ТРКИ-2]
  senses:
    - zh: 换个方式，另一种样子
      en: differently
      examples:
        - ru: Тепе́рь всё по-друго́му.
          zh: 现在什么都不一样了。

- lemma: по-прежнему
  stress: по-пре́жнему
  pos: adv
  level: [B2, ТРКИ-3]
  senses:
    - zh: 依然，照旧
      en: as before, still
      examples:
        - ru: Он по-пре́жнему рабо́тает здесь.
          zh: 他还在这儿工作。

- lemma: по-настоящему
  stress: по-настоя́щему
  pos: adv
  level: [B2, ТРКИ-3]
  senses:
    - zh: 真正地
      en: really, properly
      examples:
        - ru: Он по-настоя́щему тала́нтлив.
          zh: 他是真有才。

- lemma: кое-что
  stress: ко́е-что
  pos: pron
  level: [B2, ТРКИ-2]
  senses:
    - zh: 一点儿东西，某些事
      en: something, a thing or two
      examples:
        - ru: Я хочу́ тебе́ ко́е-что сказа́ть.
          zh: 我有点事想跟你说。
  notes: |
    ко́е- 表示"说话人心里有数但不明说"，与 -то（不知道是什么）相对。

- lemma: кое-кто
  stress: ко́е-кто
  pos: pron
  level: [B2, ТРКИ-3]
  senses:
    - zh: 某些人
      en: certain people
      examples:
        - ru: Ко́е-кто уже́ зна́ет.
          zh: 有些人已经知道了。

- lemma: кое-где
  stress: ко́е-где
  pos: adv
  level: [B2, ТРКИ-3]
  senses:
    - zh: 有些地方
      en: here and there
      examples:
        - ru: Ко́е-где ещё лежи́т снег.
          zh: 有些地方还有雪。

- lemma: где-нибудь
  stress: где́-нибудь
  pos: adv
  level: [B1, ТРКИ-2]
  senses:
    - zh: 随便哪儿，某个地方
      en: anywhere, somewhere
      examples:
        - ru: Дава́й пообе́даем где́-нибудь.
          zh: 咱们随便找个地方吃午饭。
  common_errors: |
    -то 用于已经发生、说话人不知道具体是哪儿：Он где́-то здесь。
    -нибудь 用于还没确定、任选一个：Пойдём куда́-нибудь。

- lemma: куда-нибудь
  stress: куда́-нибудь
  pos: adv
  level: [B1, ТРКИ-2]
  senses:
    - zh: 到随便哪儿
      en: (to) anywhere
      examples:
        - ru: Пое́дем куда́-нибудь на выходны́е.
          zh: 周末咱们出去转转吧。

- lemma: когда-нибудь
  stress: когда́-нибудь
  pos: adv
  level: [B1, ТРКИ-2]
  senses:
    - zh: 什么时候，将来某时
      en: some day, ever
      examples:
        - ru: Ты был когда́-нибудь в Москве́?
          zh: 你去过莫斯科吗？

- lemma: почему-то
  stress: почему́-то
  pos: adv
  level: [B2, ТРКИ-2]
  senses:
    - zh: 不知怎么的
      en: for some reason
      examples:
        - ru: Он почему́-то не пришёл.
          zh: 他不知怎么没来。

- lemma: как-то
  stress: ка́к-то
  pos: adv
  level: [B2, ТРКИ-2]
  senses:
    - zh: 不知怎么地；有一次
      en: somehow; once
      examples:
        - ru: Мне ка́к-то нело́вко.
          zh: 我总觉得有点别扭。
