- lemma: вода
  stress: вода́
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 1d
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    sing,accs: во́ду
  senses:
    - zh: 水
      en: water
      collocations: [холо́дная вода́, стака́н воды́, минера́льная вода́]
      examples:
        - ru: Да́йте, пожа́луйста, стака́н воды́.
          zh: 请给我一杯水。
  common_errors: |
    表示"一定量的水"要用第二格：стака́н воды́、мно́го воды́、немно́го воды́。
    说 «стака́н вода́» 是错的。汉语没有这个格变化，需要专门练。
  verify: [zaliznyak]

- lemma: город
  stress: го́род
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1c(1)
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 城市
      en: city, town
      collocations: [большо́й го́род, родно́й го́род, центр го́рода]
      examples:
        - ru: Москва́ — краси́вый го́род.
          zh: 莫斯科是座漂亮的城市。
        - ru: В на́шем го́роде мно́го музе́ев.
          zh: 我们城里有很多博物馆。
  common_errors: |
    复数第一格是 города́，用 -а́ 结尾而且重音移到词尾，不是 го́роды。
    同类词还有 дом → дома́、лес → леса́、по́езд → поезда́、учи́тель → учителя́、
    глаз → глаза́、ве́чер → вечера́。这批词是复数形式和重音的双重难点。
  verify: [zaliznyak]

- lemma: дом
  stress: дом
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1c(1)
  level: [A1, 高考, ТРКИ-1]
  freq_rank: 118
  senses:
    - zh: 房子，楼房
      en: house, building
      examples:
        - ru: Э́то мой дом.
          zh: 这是我家（我的房子）。
    - zh: 家
      en: home
      examples:
        - ru: В до́ме бы́ло ти́хо.
          zh: 屋里很安静。
  notes: |
    必须分清三个形式，这是初学者最容易混的一组：
    до́ма = 在家（副词，回答"在哪儿"）——«Я до́ма» 我在家；
    домо́й = 回家（副词，回答"去哪儿"）——«Я иду́ домо́й» 我回家；
    в до́ме = 在这栋房子里（前置格，指建筑物本身）。
    до́ма 和 домо́й 都是古代格形式的残留，不能按现代变格规则推导。
  common_errors: |
    复数是 дома́（重音在词尾），与 до́ма（在家）只差重音位置，写出来完全一样。
    «дома́» 楼房们 / «до́ма» 在家——这正是重音必须标注的理由。

- lemma: окно
  stress: окно́
  pos: noun
  gender: neut
  animacy: inan
  zaliznyak: с 1*d
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,gent: о́кон
  senses:
    - zh: 窗户
      en: window
      collocations: [откры́ть окно́, смотре́ть в окно́]
      examples:
        - ru: Откро́йте окно́, пожа́луйста.
          zh: 请把窗户打开。
        - ru: В ко́мнате три окна́.
          zh: 房间里有三扇窗。
  common_errors: |
    复数第二格有插入元音（逃逸元音）：о́кон，不是 окн。
    索引里的星号 * 就是标记这个逃逸元音的。同类：сестра́ → сестёр、де́вушка → де́вушек。
  verify: [zaliznyak]

- lemma: стол
  stress: стол
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1b
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 桌子
      en: table, desk
      collocations: [на столе́, за столо́м, пи́сьменный стол]
      examples:
        - ru: Кни́га лежи́т на столе́.
          zh: 书在桌上。
    - zh: 伙食，饭菜
      en: food, board
      collocations: [шве́дский стол]
      examples:
