          zh: 旅馆是自助餐。
  common_errors: |
    重音型 b：重音始终在词尾。单数第一格 стол 只有一个音节看不出来，
    一变格就显现：стола́ / столу́ / столо́м / столе́ / столы́ / столо́в。

- lemma: сестра
  stress: сестра́
  pos: noun
  gender: femn
  animacy: anim
  zaliznyak: ж 1*d
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: сёстры
    plur,gent: сестёр
    plur,accs: сестёр
    plur,datv: сёстрам
    plur,ablt: сёстрами
    plur,loct: сёстрах
  senses:
    - zh: 姐姐，妹妹
      en: sister
      collocations: [ста́ршая сестра́, мла́дшая сестра́]
      examples:
        - ru: У меня́ есть ста́ршая сестра́.
          zh: 我有个姐姐。
  notes: |
    俄语 сестра́ 不分姐妹，要说清楚得加 ста́ршая（姐）/ мла́дшая（妹）。
    брат（哥哥/弟弟）同理。这是汉语亲属称谓比俄语细的地方。
  common_errors: |
    两个难点叠在一起：复数出现 ё（сёстры），第二格又有逃逸元音（сестёр）。
    另外 сестра́ 是动物名词，复数第四格与第二格同形（ви́жу сестёр），
    不与第一格同形。动物性影响第四格，这是俄语区别于其他欧洲语言的地方。
  verify: [zaliznyak]

- lemma: слово
  stress: сло́во
  pos: noun
  gender: neut
  animacy: inan
  zaliznyak: с 1c
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 词，单词
      en: word
      collocations: [но́вое сло́во, други́ми слова́ми]
      examples:
        - ru: Как бу́дет э́то сло́во по-ру́сски?
          zh: 这个词用俄语怎么说？
        - ru: Я не по́нял после́днее сло́во.
          zh: 最后一个词我没听懂。
  common_errors: |
    复数重音移到词尾：слова́ / слов / слова́м。单数则在词干：сло́во / сло́ва。

# --- Irregular paradigms ----------------------------------------------------

- lemma: мать
  stress: мать
  pos: noun
  gender: femn
  animacy: anim
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    sing,nomn: мать
    sing,gent: ма́тери
    sing,datv: ма́тери
    sing,accs: мать
    sing,ablt: ма́терью
    sing,loct: ма́тери
    plur,nomn: ма́тери
    plur,gent: матере́й
    plur,datv: матеря́м
    plur,accs: матере́й
    plur,ablt: матеря́ми
    plur,loct: матеря́х
  senses:
    - zh: 母亲
      en: mother
      examples:
        - ru: Моя́ мать рабо́тает врачо́м.
          zh: 我母亲是医生。
  common_errors: |
    只有单数第一格和第四格是 мать，其余全部插入 -ер-：ма́тери, ма́терью…
    全俄语只有 мать 和 дочь 两个词这样变，必须整体背下来。
  notes: |
    口语里"妈妈"更常说 ма́ма；мать 偏中性或书面，有时略显生硬。

