- lemma: человек
  stress: челове́к
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 3a
  plural_lemma: люди
  level: [A1, 高考, ТРКИ-1]
  freq_rank: 21
  form_overrides:
    plur,nomn: лю́ди
    plur,gent: люде́й
    plur,datv: лю́дям
    plur,accs: люде́й
    plur,ablt: людьми́
    plur,loct: лю́дях
  senses:
    - zh: 人
      en: person, man
      collocations: [молодо́й челове́к, хоро́ший челове́к]
      examples:
        - ru: Он о́чень до́брый челове́к.
          zh: 他是个很善良的人。
  common_errors: |
    复数用补充形式 лю́ди，但和数词连用时规则特殊，考试必考：
    2–4 之后用 челове́ка（单数第二格）：два челове́ка、три челове́ка；
    5 及以上用 челове́к（形式上与单数第一格相同）：пять челове́к、мно́го челове́к。
    说 «пять люде́й» 是错的。只有在 «мно́го хоро́ших люде́й» 这类带形容词的
    表达里才用 люде́й。
  verify: [zaliznyak]

- lemma: ребёнок
  stress: ребёнок
  pos: noun
  gender: masc
  animacy: anim
  plural_lemma: дети
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    plur,nomn: де́ти
    plur,gent: дете́й
    plur,datv: де́тям
    plur,accs: дете́й
    plur,ablt: детьми́
    plur,loct: де́тях
  senses:
    - zh: 孩子，儿童
      en: child
      examples:
        - ru: У них тро́е дете́й.
          zh: 他们有三个孩子。
  common_errors: |
    复数是补充形式 де́ти，不是 ребёнки。第五格 детьми́ 带 -ьми́。
    数"孩子"通常用集合数词：тро́е дете́й（三个孩子）比 три ребёнка 更自然。
  notes: |
    ребёнок 里的 ё 本身就带重音，所以不需要额外标重音符号，变格中 ё 也始终保留：
    ребёнка / ребёнку / ребёнком。
    真正变化的是词尾的 о，它是逃逸元音，一变格就脱落：ребёнок → ребёнка。
  verify: [form_overrides]
