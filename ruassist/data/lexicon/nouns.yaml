# Nouns: mobile stress, fleeting vowels, and the genuinely irregular paradigms.
#
# Zaliznyak stress classes a-f are what make Russian nouns hard: the stress
# moves through the paradigm and is never written in ordinary text. Any form
# whose stress the paradigm cannot derive is listed in form_overrides and
# flagged for cross-checking against OpenCorpora before shipping.

- lemma: рука
  stress: рука́
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 3d
  level: [A1, 高考, ТРКИ-1]
  freq_rank: 96
  form_overrides:
    sing,accs: ру́ку
  senses:
    - zh: 手；胳膊，手臂
      en: hand, arm
      collocations: [пра́вая рука́, взять за́ руку, идти́ по́д руку]
      examples:
        - ru: У меня́ боли́т рука́.
          zh: 我的手（胳膊）疼。
        - ru: Он взял меня́ за́ руку.
          zh: 他拉住了我的手。
  notes: |
    俄语 рука́ 同时指"手"和"整条胳膊"，不像汉语分得那么清。
    需要精确表达"手掌那部分"时用 кисть。这是俄汉词汇不对应的典型例子，
    翻译时要看上下文决定译成"手"还是"胳膊"。
  common_errors: |
    重音型 d：单数重音在词尾（рука́, руки́, руке́, руко́й），
    但第四格单数是例外，重音回到词干：ру́ку。
    复数整体回到词干：ру́ки, рук, но 与格以下又移到词尾 рука́м, рука́ми, рука́х。
  verify: [zaliznyak, form_overrides]

