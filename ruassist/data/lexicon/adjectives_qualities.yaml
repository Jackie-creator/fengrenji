      examples:
        - ru: Ру́сский — мой родно́й язы́к.
          zh: 俄语是我的母语。

- lemma: знакомый
  stress: знако́мый
  pos: adj
  zaliznyak: п 1a
  level: [A2, 高考, ТРКИ-1]
  senses:
