      en: familiar, acquainted
      examples:
        - ru: Э́то знако́мое лицо́.
          zh: 这张脸挺眼熟。
    - zh: 熟人（名词化）
      en: an acquaintance
      examples:
        - ru: Он мой ста́рый знако́мый.
          zh: 他是我的老熟人。
  notes: |
    形容词直接当名词用（знако́мый / знако́мая），变格照形容词走，这是俄语的常见做法。

