          zh: 汤太咸了。

- lemma: голубой
  stress: голубо́й
  pos: adj
  zaliznyak: п 1b
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 浅蓝色的，天蓝色的
      en: light blue
      examples:
        - ru: У неё голубы́е глаза́.
          zh: 她有一双浅蓝色的眼睛。
  common_errors: |
    俄语把蓝色分成两个基本颜色词：си́ний 是深蓝，голубо́й 是浅蓝。
    汉语一个"蓝"对应两个词，说眼睛、天空一般用 голубо́й。

