# Qualities: physical properties, tastes, colours, character, evaluation.
#
# Long-form stress comes from the lemma's spelling, not from the Zaliznyak
# letter (see morphology/adjectives.py) -- the letter here describes the short
# forms, which the engine does not generate. Comparatives are irregular often
# enough that they are recorded by hand wherever the word has a common one.
#
# Soft-stem adjectives (сре́дний, по́здний) are typed «п 2», the Zaliznyak type
# for a genuinely soft stem; -ий after a velar or hushing consonant is types
# 3 and 4 and declines hard.

- lemma: необходимый
  stress: необходи́мый
  pos: adj
  zaliznyak: п 1a
  level: [B2, ТРКИ-2]
  senses:
    - zh: 必需的，不可缺少的
      en: necessary, indispensable
      examples:
        - ru: Э́то необходи́мое усло́вие.
          zh: 这是必要条件。
  synonyms: [нужный]

- lemma: полезный
  stress: поле́зный
  pos: adj
  zaliznyak: п 1*a
  comparative: поле́знее
  level: [B1, ТРКИ-1]
  senses:
    - zh: 有益的，有用的
      en: useful, beneficial
      examples:
        - ru: О́вощи о́чень поле́зны.
          zh: 蔬菜非常有益健康。
  antonyms: [вредный]

- lemma: вредный
