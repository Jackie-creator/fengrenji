- lemma: чужой
  stress: чужо́й
  pos: adj
  zaliznyak: п 4b
  level: [B1, ТРКИ-2]
  senses:
    - zh: 别人的，外人的，陌生的
      en: someone else's, foreign
      examples:
        - ru: Не бери́ чужи́е ве́щи.
          zh: 别拿别人的东西。
  antonyms: [свой]
  common_errors: |
    чужо́й 强调"不属于我／我们的"，иностра́нный 才是"外国的"。
    "外语"是 иностра́нный язы́к，不是 *чужо́й язы́к。

- lemma: родной
  stress: родно́й
