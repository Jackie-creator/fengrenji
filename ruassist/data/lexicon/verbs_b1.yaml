- lemma: поздравлять
  stress: поздравля́ть
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  aspect_pair: поздравить
  transitivity: trans
  government: кого с чем
  level: [B1, ТРКИ-1]
  senses:
    - zh: 祝贺
      en: to congratulate
      examples:
        - ru: Поздравля́ю вас с пра́здником!
          zh: 祝您节日快乐！
  common_errors: |
    结构固定：поздравля́ть **кого́**（第四格）**с чем**（第五格）。
    «Поздравля́ю с днём рожде́ния!» 生日快乐。
    照汉语说 «поздравля́ю ваш день рожде́ния» 是错的。

