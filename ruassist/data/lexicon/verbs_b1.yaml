# B1 verbs.
#
# Chosen for their government. Chinese marks none of this, so "帮他" maps onto
# помо́чь ему́ (dative) while "问他" maps onto спроси́ть его́ (accusative), and
# nothing in the Chinese tells the learner which is which. Every entry here
# states the case it demands.

- lemma: ждать
  stress: ждать
  pos: verb
  aspect: impf
  transitivity: trans
  government: кого-что / чего
  level: [A2, 高考, ТРКИ-1]
  form_overrides:
    pres,1per,sing: жду
    pres,2per,sing: ждёшь
    pres,3per,sing: ждёт
    pres,1per,plur: ждём
    pres,2per,plur: ждёте
    pres,3per,plur: ждут
    past,masc: ждал
    past,femn: ждала́
    past,neut: жда́ло
    past,plur: жда́ли
    impr,sing: жди
    impr,plur: жди́те
  senses:
    - zh: 等，等待
      en: to wait
      examples:
        - ru: Я жду тебя́ у вхо́да.
          zh: 我在入口等你。
  common_errors: |
    支配两个格，取决于对象是否确定：
    确定的人或物用第四格——«жду ма́му», «жду авто́бус но́мер пять»；
    不确定的、抽象的用第二格——«жду отве́та», «жду по́мощи», «жду авто́буса»。
    过去时阴性 ждала́ 重音在词尾，与 брать / жить 同型。

- lemma: бояться
  stress: боя́ться
  pos: verb
  zaliznyak: нсв 5b
  aspect: impf
  transitivity: intrans
  reflexive: true
  government: кого-чего
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 怕，害怕
      en: to be afraid of
      examples:
        - ru: Он бои́тся соба́к.
          zh: 他怕狗。
  common_errors: |
    后面接**第二格**：боя́ться соба́к / темноты́ / оши́бок。
    汉语"怕狗"没有任何标记，所以这个格很容易漏。
  verify: [zaliznyak]

- lemma: пользоваться
