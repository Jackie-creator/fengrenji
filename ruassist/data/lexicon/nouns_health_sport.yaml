      government: от чего
      examples:
        - ru: Э́то лека́рство от ка́шля.
          zh: 这是止咳药。
  common_errors: |
    "治什么病的药"用 от + 第二格：лека́рство от гри́ппа。
    汉语说"治感冒的药"，俄语的 от 字面是"防、去"。

