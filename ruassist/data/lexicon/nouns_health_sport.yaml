# Health and medicine; sport.
#
# Both are domains where a learner needs the words under pressure -- at a
# clinic, or following a match -- and where the phrasebook layer runs out fast.
# Case government is noted on the medical verbs' nouns because "болеть чем" vs.
# "болеть за кого" is a live trap.

