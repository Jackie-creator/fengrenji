    - zh: 游（单向）；（船）航行
      en: to swim, to sail (one direction)
      examples:
        - ru: Ло́дка плывёт по реке́.
          zh: 小船顺河而行。

# --- Everyday activity ------------------------------------------------------

- lemma: играть
  stress: игра́ть
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  transitivity: intrans
  government: во что / на чём
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 玩；演奏；扮演
      en: to play
      collocations: [игра́ть в футбо́л, игра́ть на гита́ре]
      examples:
        - ru: Де́ти игра́ют во дворе́.
          zh: 孩子们在院子里玩。
  common_errors: |
    **玩游戏／球类用 в + 第四格**：игра́ть в футбо́л / в ша́хматы；
    **演奏乐器用 на + 第六格**：игра́ть на гита́ре / на пиани́но。
    两个前置词不能混，这是考试高频点。

- lemma: петь
  stress: петь
  pos: verb
  aspect: impf
  transitivity: trans
  government: что
  level: [A2, ТРКИ-1]
  form_overrides:
    pres,1per,sing: пою́
    pres,2per,sing: поёшь
    pres,3per,sing: поёт
    pres,1per,plur: поём
    pres,2per,plur: поёте
    pres,3per,plur: пою́т
    past,masc: пел
    past,femn: пе́ла
    past,neut: пе́ло
    past,plur: пе́ли
    impr,sing: пой
    impr,plur: по́йте
  senses:
    - zh: 唱歌
      en: to sing
      examples:
        - ru: Она́ хорошо́ поёт.
          zh: 她唱得好。
  common_errors: |
    现在时词干是 по-：пою́ / поёшь，与不定式 петь 对不上。

- lemma: танцевать
  stress: танцева́ть
  pos: verb
  zaliznyak: нсв 2a
  aspect: impf
  transitivity: intrans
  level: [A2, ТРКИ-1]
  senses:
    - zh: 跳舞
      en: to dance
      examples:
        - ru: Они́ танцу́ют весь ве́чер.
          zh: 他们跳了一晚上舞。
  common_errors: |
    -евать 型：танцу́ю / танцу́ешь，-ева- 变 -у-，与 сове́товать 同型。
  verify: [zaliznyak]

- lemma: рисовать
  stress: рисова́ть
  pos: verb
  zaliznyak: нсв 2a
  aspect: impf
  transitivity: trans
  government: что
  level: [A2, ТРКИ-1]
  senses:
    - zh: 画（画）
      en: to draw
      examples:
        - ru: Он рису́ет о́чень хорошо́.
          zh: 他画得很好。
  common_errors: |
    与 писа́ть 分工：铅笔／钢笔画用 рисова́ть，油画用 писа́ть。
  verify: [zaliznyak]

- lemma: учить
  stress: учи́ть
  pos: verb
  zaliznyak: нсв 4c
  aspect: impf
  aspect_pair: выучить
  transitivity: trans
  government: что / кого чему
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 学，背（记住）；教
      en: to learn by heart, to teach
      examples:
        - ru: Я учу́ но́вые слова́.
          zh: 我在背生词。
  common_errors: |
    三个"学"要分清：
    учи́ть что（背下来）／ изуча́ть что（系统研究）／ учи́ться где（在某处上学）。
    另外 учи́ть кого́ чему́ 是"教某人某事"，同一个词兼表"学"和"教"，靠支配关系区分。

- lemma: выучить
  stress: вы́учить
  pos: verb
  zaliznyak: св 4a
  aspect: perf
  aspect_pair: учить
  transitivity: trans
  government: что
  level: [A2, ТРКИ-1]
  senses:
    - zh: 学会，背会（完成体）
      en: to learn, to master
      examples:
        - ru: Я вы́учил все слова́.
          zh: 单词我都背下来了。
  notes: |
    前缀 вы- 夺取重音：вы́учить / вы́учу，与 вы́йти、вы́брать 同型。

# --- Emotion and mental state -----------------------------------------------

- lemma: верить
  stress: ве́рить
  pos: verb
  zaliznyak: нсв 4a
  aspect: impf
  aspect_pair: поверить
  transitivity: intrans
  government: кому-чему / в кого-что
  level: [B1, ТРКИ-1]
  senses:
    - zh: 相信
      en: to believe
      examples:
        - ru: Я тебе́ ве́рю.
          zh: 我信你。
  common_errors: |
    两种支配意思不同：
    ве́рить **кому́**（第三格）= 相信某人说的话；
    ве́рить **в кого́-что**（в + 第四格）= 信仰、相信……的存在。
    «Я ве́рю тебе́» 我信你 ／ «Я ве́рю в тебя́» 我看好你。

- lemma: поверить
  stress: пове́рить
  pos: verb
  zaliznyak: св 4a
  aspect: perf
  aspect_pair: верить
  transitivity: intrans
  government: кому-чему / в кого-что
  level: [B1, ТРКИ-2]
  senses:
    - zh: 相信了（完成体）
      en: to believe
      examples:
        - ru: Он мне не пове́рил.
          zh: 他没信我。

- lemma: надеяться
  stress: наде́яться
  pos: verb
  zaliznyak: нсв 6a
  aspect: impf
  transitivity: intrans
  reflexive: true
  government: на кого-что
  level: [B1, ТРКИ-1]
  senses:
    - zh: 希望，指望
      en: to hope
      examples:
        - ru: Я наде́юсь, что всё бу́дет хорошо́.
          zh: 我希望一切都好。
  common_errors: |
    "指望某人"用 на + 第四格：наде́яться на тебя́。
  verify: [zaliznyak]

- lemma: волноваться
  stress: волнова́ться
  pos: verb
  zaliznyak: нсв 2a
  aspect: impf
  transitivity: intrans
  reflexive: true
  government: за кого / о ком
  level: [B1, ТРКИ-2]
  senses:
    - zh: 担心，激动
      en: to worry, to be excited
      examples:
        - ru: Не волну́йтесь, всё в поря́дке.
          zh: 别担心，都好着呢。
  verify: [zaliznyak]

- lemma: скучать
  stress: скуча́ть
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  transitivity: intrans
  government: по кому-чему
  level: [B1, ТРКИ-1]
  senses:
    - zh: 想念；无聊
      en: to miss, to be bored
      examples:
        - ru: Я скуча́ю по до́му.
          zh: 我想家。
  common_errors: |
    "想念某人"用 по + 第三格：скуча́ю по тебе́。
    这是 по 支配第三格的典型用法，不能用第四格。

- lemma: удивляться
  stress: удивля́ться
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  transitivity: intrans
  reflexive: true
  government: кому-чему
  level: [B1, ТРКИ-2]
  senses:
    - zh: 感到惊讶
      en: to be surprised
      examples:
        - ru: Я удивля́юсь его́ спосо́бностям.
          zh: 我对他的能力感到惊讶。
  common_errors: |
    接第三格。同组接第三格的情感动词还有 ра́доваться（高兴）、
    зави́довать（羡慕）、сочу́вствовать（同情）。

- lemma: радоваться
  stress: ра́доваться
  pos: verb
  zaliznyak: нсв 2a
  aspect: impf
  transitivity: intrans
  reflexive: true
  government: кому-чему
  level: [B1, ТРКИ-2]
  senses:
    - zh: 高兴，感到喜悦
      en: to rejoice
      examples:
        - ru: Де́ти ра́дуются пода́ркам.
          zh: 孩子们为礼物高兴。
  verify: [zaliznyak]
