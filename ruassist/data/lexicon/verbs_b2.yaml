# The rest of the motion-verb system, plus emotion and everyday activity verbs.
#
# Russian has fourteen basic motion pairs. идти/ходить and ехать/ездить are only
# the first two; the ones below complete the set a learner actually meets, and
# each is a uni/multi pair on exactly the same principle.

# --- Motion: carrying, leading, running, flying, swimming -------------------

- lemma: нести
  stress: нести́
  pos: verb
  aspect: impf
  transitivity: trans
  motion_group: uni
  motion_partner: носить
  government: кого-что
  level: [B1, ТРКИ-1]
  form_overrides:
    pres,1per,sing: несу́
    pres,2per,sing: несёшь
    pres,3per,sing: несёт
    pres,1per,plur: несём
    pres,2per,plur: несёте
    pres,3per,plur: несу́т
    past,masc: нёс
    past,femn: несла́
    past,neut: несло́
    past,plur: несли́
    impr,sing: неси́
    impr,plur: неси́те
  senses:
    - zh: 拿着走，携带（单向，手提）
      en: to carry (one direction)
      examples:
        - ru: Он несёт тяжёлую су́мку.
          zh: 他提着个沉包。
  common_errors: |
    过去时阳性 нёс 没有 -л，与 мог、вёз 同型。

- lemma: носить
  stress: носи́ть
  pos: verb
  zaliznyak: нсв 4c
  aspect: impf
  transitivity: trans
  motion_group: multi
  motion_partner: нести
  government: кого-что
  level: [B1, ТРКИ-1]
  senses:
    - zh: （经常）携带；穿（衣服）
      en: to carry (repeatedly), to wear
      examples:
        - ru: Она́ но́сит очки́.
          zh: 她戴眼镜。
  common_errors: |
    "穿／戴（习惯性）"就用这个不定向形式：носи́ть очки́ / ша́пку。
    "此刻正穿着"用 быть в чём：«Она́ в кра́сном пла́тье»。

- lemma: вести
  stress: вести́
  pos: verb
  aspect: impf
  transitivity: trans
  motion_group: uni
  motion_partner: водить
  government: кого-что
  level: [B1, ТРКИ-2]
  form_overrides:
    pres,1per,sing: веду́
    pres,2per,sing: ведёшь
    pres,3per,sing: ведёт
    pres,1per,plur: ведём
    pres,2per,plur: ведёте
    pres,3per,plur: веду́т
    past,masc: вёл
    past,femn: вела́
    past,neut: вело́
    past,plur: вели́
    impr,sing: веди́
    impr,plur: веди́те
  senses:
    - zh: 领着走（单向）；主持
      en: to lead (one direction)
      examples:
        - ru: Мать ведёт ребёнка в шко́лу.
          zh: 母亲领着孩子去学校。

- lemma: водить
  stress: води́ть
  pos: verb
  zaliznyak: нсв 4c
  aspect: impf
  transitivity: trans
  motion_group: multi
  motion_partner: вести
  government: кого-что
  level: [B1, ТРКИ-2]
  senses:
    - zh: （经常）领着；开（车）
      en: to lead (repeatedly), to drive
      examples:
        - ru: Он уме́ет води́ть маши́ну.
          zh: 他会开车。
  common_errors: |
    "会开车"固定说 води́ть маши́ну（不定向），不能用 вести́。

- lemma: везти
  stress: везти́
  pos: verb
  aspect: impf
  transitivity: trans
  motion_group: uni
  motion_partner: возить
  government: кого-что
  level: [B1, ТРКИ-2]
  form_overrides:
    pres,1per,sing: везу́
    pres,2per,sing: везёшь
    pres,3per,sing: везёт
    pres,1per,plur: везём
    pres,2per,plur: везёте
    pres,3per,plur: везу́т
    past,masc: вёз
    past,femn: везла́
    past,neut: везло́
    past,plur: везли́
    impr,sing: вези́
    impr,plur: вези́те
  senses:
    - zh: 用车运送（单向）
      en: to transport (one direction)
      examples:
        - ru: Он везёт нас на вокза́л.
          zh: 他开车送我们去火车站。
  notes: |
    与 нести́ 的分工：手提用 нести́，车载用 везти́。
    无人称用法 «Мне везёт» 是"我走运"。

- lemma: возить
  stress: вози́ть
  pos: verb
  zaliznyak: нсв 4c
  aspect: impf
  transitivity: trans
  motion_group: multi
  motion_partner: везти
  government: кого-что
  level: [B1, ТРКИ-2]
  senses:
    - zh: （经常）用车运送
      en: to transport (repeatedly)
      examples:
        - ru: Он ка́ждый день во́зит дете́й в шко́лу.
          zh: 他每天开车送孩子上学。

- lemma: бежать
  stress: бежа́ть
  pos: verb
  aspect: impf
  transitivity: intrans
  motion_group: uni
  motion_partner: бегать
  level: [B1, ТРКИ-1]
  form_overrides:
    pres,1per,sing: бегу́
    pres,2per,sing: бежи́шь
    pres,3per,sing: бежи́т
    pres,1per,plur: бежи́м
    pres,2per,plur: бежи́те
    pres,3per,plur: бегу́т
    past,masc: бежа́л
    past,femn: бежа́ла
    past,neut: бежа́ло
    past,plur: бежа́ли
    impr,sing: беги́
    impr,plur: беги́те
  senses:
    - zh: 跑（单向）
      en: to run (one direction)
      examples:
        - ru: Он бежи́т к авто́бусу.
          zh: 他朝公交车跑去。
  common_errors: |
    与 хоте́ть 一样是混合变位：бегу́ / бежи́шь …… / бегу́т，
    第一人称单数和第三人称复数保留 г，中间都是 ж。全俄语只有这两个动词这样。

- lemma: бегать
  stress: бе́гать
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  transitivity: intrans
  motion_group: multi
  motion_partner: бежать
  level: [B1, ТРКИ-1]
  senses:
    - zh: （经常地、来回地）跑
      en: to run (repeatedly)
      examples:
        - ru: Он бе́гает ка́ждое у́тро.
          zh: 他每天早上跑步。

- lemma: лететь
  stress: лете́ть
  pos: verb
  zaliznyak: нсв 5b
  aspect: impf
  transitivity: intrans
  motion_group: uni
  motion_partner: летать
  level: [B1, ТРКИ-1]
  senses:
    - zh: 飞（单向）；乘飞机去
      en: to fly (one direction)
      examples:
        - ru: Мы лети́м в Москву́.
          zh: 我们（坐飞机）去莫斯科。
  common_errors: |
    第一人称单数 т → ч：лечу́。与 лечи́ть（治疗）的 лечу́ 完全同形，靠上下文区分。

- lemma: летать
  stress: лета́ть
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  transitivity: intrans
  motion_group: multi
  motion_partner: лететь
  level: [B1, ТРКИ-1]
  senses:
    - zh: （经常地）飞；坐飞机
      en: to fly (repeatedly)
      examples:
        - ru: Он ча́сто лета́ет в Кита́й.
          zh: 他常飞中国。

- lemma: плавать
  stress: пла́вать
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  transitivity: intrans
  motion_group: multi
  motion_partner: плыть
  level: [B1, ТРКИ-1]
  senses:
    - zh: 会游泳；（经常）游
      en: to swim (repeatedly)
      examples:
        - ru: Он хорошо́ пла́вает.
          zh: 他游泳游得好。
  common_errors: |
    "会游泳"用不定向的 пла́вать，不是 плыть。

- lemma: плыть
  stress: плыть
  pos: verb
  aspect: impf
  transitivity: intrans
  motion_group: uni
  motion_partner: плавать
  level: [B1, ТРКИ-2]
  form_overrides:
    pres,1per,sing: плыву́
    pres,2per,sing: плывёшь
    pres,3per,sing: плывёт
    pres,1per,plur: плывём
    pres,2per,plur: плывёте
    pres,3per,plur: плыву́т
    past,masc: плыл
    past,femn: плыла́
    past,neut: плы́ло
    past,plur: плы́ли
    impr,sing: плыви́
    impr,plur: плыви́те
