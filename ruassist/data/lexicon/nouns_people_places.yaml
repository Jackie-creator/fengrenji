- lemma: такси
  stress: такси́
  pos: noun
  gender: neut
  animacy: inan
  indeclinable: true
  level: [A2, ТРКИ-1]
  senses:
    - zh: 出租车
      en: taxi
      examples:
        - ru: Дава́й возьмём такси́.
          zh: 咱们打车吧。
  common_errors: |
    不变格中性名词。"打车"是 взять такси́ 或 пое́хать на такси́。

