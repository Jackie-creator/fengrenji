- lemma: корова
  stress: коро́ва
  pos: noun
  gender: femn
  animacy: anim
  zaliznyak: ж 1a
  level: [B1, ТРКИ-1]
  senses:
    - zh: 母牛
      en: cow
      examples:
        - ru: Коро́вы даю́т молоко́.
          zh: 牛产奶。

- lemma: медведь
  stress: медве́дь
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 2a
  level: [B1, ТРКИ-1]
  senses:
    - zh: 熊
      en: bear
      examples:
        - ru: Медве́дь спит зимо́й.
          zh: 熊冬天睡觉。
  notes: |
    俄罗斯的象征性动物，在成语和民间故事里高频出现。

- lemma: мышь
  stress: мышь
  pos: noun
  gender: femn
  animacy: anim
  zaliznyak: ж 8e
  level: [B1, ТРКИ-1]
  senses:
    - zh: 老鼠；（电脑）鼠标
      en: mouse
      examples:
        - ru: Ко́шка пойма́ла мышь.
          zh: 猫抓住了老鼠。
  common_errors: |
    以 ь 结尾但是**阴性**，与 медве́дь（阳性）对照。
    -ь 结尾的名词性别要逐个记，没有可靠规则。
  verify: [zaliznyak]
