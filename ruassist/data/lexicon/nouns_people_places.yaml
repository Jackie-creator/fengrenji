# --- Education --------------------------------------------------------------

- lemma: ученик
  stress: учени́к
  pos: noun
  gender: masc
  animacy: anim
  zaliznyak: м 3b
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 学生（中小学）；徒弟
      en: pupil
      examples:
        - ru: В кла́ссе два́дцать ученико́в.
          zh: 班里有二十个学生。
  common_errors: |
    与 студе́нт 分工：ученик 是中小学生，студе́нт 只指大学生。

- lemma: лекция
  stress: ле́кция
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 7a
  level: [A2, ТРКИ-1]
  senses:
    - zh: 讲座，大课
      en: lecture
      examples:
        - ru: Сего́дня две ле́кции.
          zh: 今天有两节大课。

- lemma: предмет
  stress: предме́т
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1a
  level: [B1, ТРКИ-1]
  senses:
    - zh: 科目；物品
      en: subject, object
      examples:
        - ru: Како́й твой люби́мый предме́т?
          zh: 你最喜欢哪门课？

- lemma: курс
  stress: курс
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1a
  level: [A2, ТРКИ-1]
  senses:
    - zh: 年级（大学）；课程
      en: year of study, course
      examples:
        - ru: Я учу́сь на тре́тьем ку́рсе.
          zh: 我上大三。
  common_errors: |
    "上几年级（大学）"用 на + 第六格：на тре́тьем ку́рсе。
    中小学年级用 класс：в тре́тьем кла́ссе。

- lemma: оценка
  stress: оце́нка
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 3*a
  level: [B1, ТРКИ-1]
  senses:
    - zh: 分数，评价
      en: mark, grade
      examples:
        - ru: Он получи́л хоро́шую оце́нку.
          zh: 他得了个好分数。

# --- Transport --------------------------------------------------------------

- lemma: вокзал
  stress: вокза́л
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1a
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 火车站
      en: railway station
      examples:
        - ru: Мы встре́тились на вокза́ле.
          zh: 我们在火车站碰的头。
  common_errors: |
    "在火车站"用 на вокза́ле，不是 в。

- lemma: аэропорт
  stress: аэропо́рт
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1c
  level: [A2, ТРКИ-1]
  form_overrides:
    sing,loc2: аэропорту́
  senses:
    - zh: 机场
      en: airport
      examples:
        - ru: Он уже́ в аэропорту́.
          zh: 他已经在机场了。
  common_errors: |
    "在机场"用处所格 в аэропорту́（重音在词尾），不是 в аэропо́рте。

- lemma: станция
  stress: ста́нция
  pos: noun
  gender: femn
  animacy: inan
