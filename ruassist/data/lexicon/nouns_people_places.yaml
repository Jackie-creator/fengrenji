- lemma: лошадь
  stress: ло́шадь
  pos: noun
  gender: femn
  animacy: anim
  zaliznyak: ж 8e
  level: [B1, ТРКИ-1]
  form_overrides:
    plur,ablt: лошадьми́
  senses:
    - zh: 马
      en: horse
      examples:
