        - ru: Э́то ста́нция метро́ «Арба́тская».
          zh: 这是阿尔巴特地铁站。

- lemma: остановка
  stress: остано́вка
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 3*a
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 站（公交、电车）
