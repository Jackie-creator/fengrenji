- lemma: птица
  stress: пти́ца
  pos: noun
  gender: femn
  animacy: anim
  zaliznyak: ж 5a
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 鸟
      en: bird
      examples:
