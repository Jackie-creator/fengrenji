# Relational adjectives: time, place, material, social domain, plus a second
# round of evaluative and character words.
#
# Relational adjectives mostly have no short forms and no comparative -- you
# cannot be "more wooden" -- so those fields are absent by design, not by
# omission. Soft stems (-ний) are typed «п 2»; see adjectives_qualities.yaml.

- lemma: вечный
  stress: ве́чный
  pos: adj
  zaliznyak: п 1*a
  level: [B2, ТРКИ-3]
  senses:
    - zh: 永恒的，没完没了的
      en: eternal, perpetual
      examples:
        - ru: Э́то ве́чный вопро́с.
          zh: 这是个永恒的问题。

