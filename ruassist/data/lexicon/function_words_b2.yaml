# Closed classes, completed: the rest of the cardinals and ordinals, collective
# numerals, the remaining prepositions and conjunctions, particles, and the
# indefinite/determinative pronouns.
#
# Closed sets are collected whole on purpose -- a learner cannot tell that
# се́мьдесят is missing, they just fail to find it. 11-19 and 50-80 decline in
# one piece (пятна́дцати, семи́десяти); 200-900 decline in both halves.

