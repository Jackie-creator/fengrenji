    俄语说钟点用"下一个小时的几分之几"：че́тверть восьмо́го = 七点一刻。

- lemma: вместо
  stress: вме́сто
  pos: prep
  government: чего
  level: [B1, ТРКИ-2]
  senses:
    - zh: 代替，而不是
      en: instead of
      examples:
        - ru: Он пришёл вме́сто бра́та.
          zh: 他代替哥哥来了。

- lemma: кроме
  stress: кро́ме
  pos: prep
  government: чего
  level: [B1, ТРКИ-2]
  senses:
    - zh: 除……之外
      en: except, besides
      collocations: [кро́ме того́]
      examples:
        - ru: Пришли́ все, кро́ме него́.
          zh: 除了他，大家都来了。
  common_errors: |
    кро́ме того́ = 此外（补充），кро́ме э́того 才是"除这个以外"。
    两个短语意思相反，写作里容易用混。

- lemma: среди
  stress: среди́
  pos: prep
  government: кого-чего
  level: [B2, ТРКИ-2]
  senses:
    - zh: 在……中间，在……当中
      en: among
      examples:
        - ru: Среди́ госте́й был и он.
          zh: 客人当中也有他。

- lemma: напротив
  stress: напро́тив
  pos: prep
  government: чего
  level: [B1, ТРКИ-2]
  senses:
    - zh: 在……对面
      en: opposite
      examples:
        - ru: Апте́ка напро́тив шко́лы.
          zh: 药店在学校对面。

- lemma: вдоль
  stress: вдоль
  pos: prep
  government: чего
  level: [B2, ТРКИ-3]
  senses:
    - zh: 沿着
      en: along
      examples:
        - ru: Мы шли вдоль реки́.
          zh: 我们沿着河走。

- lemma: благодаря
  stress: благодаря́
  pos: prep
  government: кому-чему
  level: [B2, ТРКИ-2]
  senses:
    - zh: 多亏，由于（好结果）
      en: thanks to
      examples:
        - ru: Благодаря́ ему́ мы успе́ли.
          zh: 多亏了他我们才赶上。
  common_errors: |
    带第三格，而且只用于**好**结果。坏结果用 из-за：
    благодаря́ по́мощи（多亏帮助）／ из-за дождя́（因为下雨，糟了）。

- lemma: ради
  stress: ра́ди
  pos: prep
  government: кого-чего
  level: [B2, ТРКИ-3]
  senses:
    - zh: 为了……起见
      en: for the sake of
      collocations: [ра́ди бо́га]
      examples:
        - ru: Он сде́лал э́то ра́ди дете́й.
          zh: 他这么做是为了孩子。

- lemma: сквозь
  stress: сквозь
  pos: prep
  government: что
  level: [B2, ТРКИ-3]
  senses:
    - zh: 穿过，透过
      en: through
      examples:
        - ru: Свет проходи́л сквозь што́ры.
          zh: 光透过窗帘照进来。

- lemma: перед
  stress: пе́ред
  pos: prep
  government: кем-чем
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 在……前面；在……之前
      en: in front of; before
      examples:
        - ru: Он стои́т пе́ред до́мом.
          zh: 他站在房子前面。
  notes: |
    辅音丛前用 пе́редо：пе́редо мно́й。

- lemma: возле
  stress: во́зле
  pos: prep
  government: чего
  level: [B1, ТРКИ-2]
  senses:
    - zh: 在……旁边
      en: beside, near
      examples:
        - ru: Он сел во́зле окна́.
          zh: 他坐在窗边。
  synonyms: [около]

- lemma: мимо
  stress: ми́мо
  pos: prep
  government: кого-чего
  level: [B2, ТРКИ-2]
  senses:
    - zh: 从……旁边经过
      en: past, by
      examples:
        - ru: Он прошёл ми́мо меня́.
          zh: 他从我身边走过去了。

- lemma: однако
  stress: одна́ко
  pos: conj
  level: [B2, ТРКИ-2]
  senses:
    - zh: 然而，不过
      en: however
      examples:
        - ru: Он обеща́л, одна́ко не пришёл.
          zh: 他答应了，可是没来。

- lemma: зато
  stress: зато́
  pos: conj
  level: [B2, ТРКИ-2]
  senses:
    - zh: 但是（后面是好的一面）
      en: but on the other hand
      examples:
        - ru: До́рого, зато́ ка́чественно.
          zh: 贵是贵，但东西好。
  notes: |
    зато́ 后面一定是补偿性的好处，语气和 но 不同。

- lemma: либо
  stress: ли́бо
  pos: conj
  level: [B2, ТРКИ-3]
  senses:
    - zh: 或者（书面）
      en: either, or
      examples:
        - ru: Ли́бо сейча́с, ли́бо никогда́.
          zh: 要么现在，要么永远别提。

- lemma: будто
  stress: бу́дто
  pos: conj
  level: [B2, ТРКИ-3]
  senses:
    - zh: 好像，仿佛
      en: as if
      examples:
        - ru: Он говори́т так, бу́дто всё зна́ет.
          zh: 他说得好像什么都知道似的。

- lemma: словно
  stress: сло́вно
  pos: conj
  level: [B2, ТРКИ-3]
  senses:
    - zh: 宛如，好像
      en: like, as though
      examples:
        - ru: Она́ побледне́ла, сло́вно уви́дела привиде́ние.
          zh: 她脸都白了，像见了鬼似的。

- lemma: пока
  stress: пока́
  pos: conj
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 当……的时候；在……之前
      en: while, until
      examples:
        - ru: Подожди́, пока́ я оде́нусь.
          zh: 等我穿好衣服。
    - zh: 再见（口语）
      en: bye
      labels: [разг.]
      examples:
        - ru: Ну ла́дно, пока́!
          zh: 好，回见！
  common_errors: |
    пока́ + 肯定 = "当……时"；пока́ не + 完成体 = "直到……为止"。
    «Жди, пока́ он не придёт» 里的 не 不表示否定，不能省。

- lemma: поскольку
  stress: поско́льку
  pos: conj
  level: [B2, ТРКИ-3]
  senses:
    - zh: 既然，因为（书面）
      en: since, inasmuch as
      examples:
        - ru: Поско́льку вре́мени ма́ло, начнём сра́зу.
          zh: 既然时间不多，我们马上开始。

- lemma: причём
  stress: причём
  pos: conj
  level: [B2, ТРКИ-3]
  senses:
    - zh: 而且，并且（追加）
      en: moreover, and what is more
      examples:
        - ru: Он опозда́л, причём си́льно.
          zh: 他迟到了，而且迟得厉害。

- lemma: же
  stress: же
  pos: part
  level: [B1, ТРКИ-2]
  senses:
    - zh: 加强语气；表对比
      en: emphatic particle
      examples:
        - ru: Ты же обеща́л!
          zh: 你可是答应过的！
  notes: |
    紧跟被强调的词之后，本身不重读。口语里常缩成 ж：Ты ж зна́ешь。

- lemma: бы
  stress: бы
  pos: part
  level: [B1, ТРКИ-2]
  senses:
    - zh: 构成虚拟语气
      en: subjunctive particle
      examples:
        - ru: Я бы пошёл, но не могу́.
          zh: 我倒想去，可是去不了。
  common_errors: |
    俄语虚拟式 = 过去时 + бы，没有时间区别：
    «Е́сли бы я знал» 既可以指过去也可以指现在，靠上下文判断。

- lemma: неужели
  stress: неуже́ли
  pos: part
  level: [B2, ТРКИ-2]
  senses:
    - zh: 难道，真的吗
      en: really?, surely not
      examples:
        - ru: Неуже́ли ты не по́мнишь?
          zh: 你难道不记得了？

- lemma: именно
  stress: и́менно
  pos: part
  level: [B2, ТРКИ-2]
  senses:
