- lemma: всякий
  stress: вся́кий
  pos: adj
  zaliznyak: п 3a
  level: [B2, ТРКИ-2]
  senses:
    - zh: 各种各样的；任何
      en: every kind of, any
      collocations: [на вся́кий слу́чай]
      examples:
        - ru: Возьми́ зонт на вся́кий слу́чай.
          zh: 以防万一，带把伞。

