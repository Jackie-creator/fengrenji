      en: some, certain
      examples:
        - ru: Не́которые студе́нты опозда́ли.
          zh: 有些学生迟到了。

- lemma: иной
  stress: ино́й
  pos: adj
  zaliznyak: п 1b
  level: [B2, ТРКИ-3]
  senses:
    - zh: 另外的，别的（书面）
      en: other, different
      examples:
        - ru: Э́то соверше́нно ино́й вопро́с.
          zh: 这完全是另一个问题。

- lemma: никакой
  stress: никако́й
  pos: adj
  zaliznyak: п 3b
  level: [B1, ТРКИ-2]
  senses:
