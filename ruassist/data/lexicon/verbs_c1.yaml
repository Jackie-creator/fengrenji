- lemma: надевать
  stress: надева́ть
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  aspect_pair: надеть
  transitivity: trans
  government: что
  level: [A2, ТРКИ-1]
  senses:
    - zh: 穿上，戴上（某件衣物）
      en: to put on
      examples:
        - ru: Он надева́ет ку́ртку.
          zh: 他穿上夹克。
  common_errors: |
    надева́ть **что**（穿某件衣服）／ одева́ть **кого́**（给某人穿衣）。
    俄语人自己都常混，助记口诀是 «надева́ть оде́жду, одева́ть Наде́жду»。

