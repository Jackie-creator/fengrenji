# Further verbs, aspect pairs kept together.

- lemma: начинаться
  stress: начина́ться
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  aspect_pair: начаться
  transitivity: intrans
  reflexive: true
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 开始（自动）
      en: to begin (intransitive)
      examples:
        - ru: Уро́к начина́ется в де́вять.
          zh: 九点开始上课。
  common_errors: |
    及物的"开始做某事"用 начина́ть，主语自己开始用 начина́ться：
    «Я начина́ю уро́к» 我开始上课 ／ «Уро́к начина́ется» 课开始了。
    带 -ся 的一批动词都是这个逻辑（конча́ться、открыва́ться、продолжа́ться）。

