      en: Chinese man
      examples:
        - ru: Он кита́ец из Пеки́на.
          zh: 他是北京来的中国人。
  common_errors: |
    间接格里 е 变成 й：кита́ец → кита́йца、кита́йцы。
    女性是 китая́нка，不能用 кита́ец 指女性。

