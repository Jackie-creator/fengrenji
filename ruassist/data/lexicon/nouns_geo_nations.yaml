# Countries, cities, peoples and languages.
#
# Proper nouns earn dictionary entries here because a learner needs to decline
# them (в Росси́и, из Кита́я, по Москве́) and Russian gives no help from the
# Chinese transliteration. Nationality nouns and the matching adjective are
# listed together: кита́ец / кита́йский is one thing to learn, not two.

- lemma: Россия
  stress: Росси́я
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 7a
  number_only: sing
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 俄罗斯
      en: Russia
      examples:
        - ru: Он живёт в Росси́и.
          zh: 他住在俄罗斯。
  notes: |
    第六格是 в Росси́и（7 型，该用 -е 的地方用 -и），不是 *в Росси́е。

