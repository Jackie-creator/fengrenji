# Core A1 adjectives.

- lemma: новый
  stress: но́вый
  pos: adj
  zaliznyak: п 1a
  short_form: true
  comparative: нове́е
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 新的
      en: new
      examples:
        - ru: Э́то но́вый уче́бник.
          zh: 这是本新课本。
  notes: |
    硬变化形容词的标准样板：но́вый / но́вая / но́вое / но́вые。
    所有硬变化形容词都照这套词尾，与软变化 си́ний 一组对照。
  antonyms: [старый]

- lemma: старый
  stress: ста́рый
  pos: adj
  zaliznyak: п 1a
  short_form: true
  comparative: ста́рше
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 旧的；老的
      en: old
      examples:
        - ru: Он живёт в ста́ром до́ме.
          zh: 他住在一栋老房子里。
  common_errors: |
    比较级分工不同：ста́рше 用于人的年龄（«Он ста́рше меня́» 他比我大），
    старе́е 用于东西的陈旧程度。用错会很明显。
  antonyms: [новый, молодой]

- lemma: молодой
  stress: молодо́й
  pos: adj
  zaliznyak: п 1b
  short_form: true
  comparative: моло́же
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 年轻的
      en: young
      collocations: [молодо́й челове́к]
      examples:
        - ru: Она́ ещё о́чень молода́.
          zh: 她还很年轻。
  notes: |
    «молодо́й челове́к» 是称呼年轻男性的常用语，相当于"小伙子／这位先生"。
    短尾阴性 молода́ 重音在词尾。

- lemma: плохой
  stress: плохо́й
  pos: adj
  zaliznyak: п 1b
  short_form: true
  comparative: ху́же
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 坏的，不好的
      en: bad
      examples:
        - ru: Сего́дня плоха́я пого́да.
          zh: 今天天气不好。
  common_errors: |
    比较级 ху́же 是补充形式，与词根无关，和 лу́чше 正好对称。
  antonyms: [хороший]

- lemma: красивый
  stress: краси́вый
  pos: adj
  zaliznyak: п 1a
  short_form: true
  comparative: краси́вее
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 漂亮的，美的
      en: beautiful
      examples:
        - ru: Кака́я краси́вая пе́сня!
          zh: 多好听的歌啊！
  common_errors: |
    比较级重音在 -си́-：краси́вее，不是 красиве́е。这是常见读音错误。

- lemma: интересный
  stress: интере́сный
  pos: adj
  zaliznyak: п 1*a
  short_form: true
  comparative: интере́снее
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 有趣的，有意思的
      en: interesting
      examples:
        - ru: Мы посмотре́ли интере́сный фильм.
          zh: 我们看了部有意思的电影。
  verify: [zaliznyak]

- lemma: трудный
  stress: тру́дный
  pos: adj
  zaliznyak: п 1*a
  short_form: true
  comparative: трудне́е
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 困难的，难的
      en: difficult
      examples:
        - ru: Ру́сский язы́к — тру́дный, но интере́сный.
          zh: 俄语很难，但很有意思。
  antonyms: [лёгкий]
  verify: [zaliznyak]

- lemma: лёгкий
  stress: лёгкий
  pos: adj
  zaliznyak: п 3a*
  short_form: true
  comparative: ле́гче
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 轻的；容易的
      en: light, easy
      examples:
        - ru: Э́то о́чень лёгкий вопро́с.
          zh: 这个问题很简单。
  common_errors: |
    比较级 ле́гче 里 г 变 ч，而且读作 [ле́хче]。
    形容词本身 лёгкий 也读作 [лёхкий]，гк 组合读 [хк]，这是不规则读音。
  antonyms: [трудный]
  verify: [zaliznyak]

- lemma: длинный
  stress: дли́нный
  pos: adj
  zaliznyak: п 1*a
  short_form: true
  comparative: длинне́е
  level: [A1, ТРКИ-1]
  senses:
    - zh: 长的
      en: long
      examples:
        - ru: Э́то о́чень дли́нный текст.
          zh: 这篇课文很长。
  antonyms: [короткий]
  verify: [zaliznyak]

- lemma: короткий
  stress: коро́ткий
  pos: adj
  zaliznyak: п 3a*
  short_form: true
  comparative: коро́че
  level: [A1, ТРКИ-1]
  senses:
    - zh: 短的
      en: short
      examples:
        - ru: Он написа́л коро́ткое письмо́.
          zh: 他写了封短信。
  antonyms: [длинный]
  verify: [zaliznyak]

- lemma: тёплый
  stress: тёплый
  pos: adj
  zaliznyak: п 1*a
  short_form: true
  comparative: тепле́е
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 暖和的，温暖的
      en: warm
      examples:
        - ru: Сего́дня тёплый день.
          zh: 今天天气暖和。
  antonyms: [холодный]
  verify: [zaliznyak]

- lemma: холодный
  stress: холо́дный
  pos: adj
  zaliznyak: п 1*a
  short_form: true
  comparative: холодне́е
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 冷的，凉的
      en: cold
      examples:
        - ru: Зимо́й здесь о́чень хо́лодно.
          zh: 这儿冬天很冷。
  notes: |
    例句里的 хо́лодно 是无人称谓语（副词形式），表示天气或感受，不是形容词短尾。
    这类"категория состояния"还有 тепло́、тру́дно、интере́сно。
  antonyms: [тёплый]
  verify: [zaliznyak]

- lemma: дорогой
  stress: дорого́й
  pos: adj
  zaliznyak: п 3b*
  short_form: true
  comparative: доро́же
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 贵的
      en: expensive
      examples:
        - ru: Э́тот телефо́н сли́шком дорого́й.
          zh: 这个手机太贵了。
    - zh: 亲爱的
      en: dear
      examples:
        - ru: Дорого́й друг!
          zh: 亲爱的朋友！
  notes: |
    书信开头的"亲爱的"就用这个词：Дорого́й Ива́н! / Дорога́я ма́ма!
  antonyms: [дешёвый]
  verify: [zaliznyak]

- lemma: дешёвый
  stress: дешёвый
  pos: adj
  zaliznyak: п 1a
  short_form: true
  comparative: деше́вле
  level: [A1, ТРКИ-1]
  senses:
    - zh: 便宜的
      en: cheap
      examples:
        - ru: Здесь всё о́чень дёшево.
          zh: 这儿什么都很便宜。
  common_errors: |
    比较级 деше́вле 里 ё 变 е 且重音移位，副词形式又是 дёшево。
    三个形式 дешёвый / деше́вле / дёшево 的 е-ё 分布各不相同，容易写错。
  antonyms: [дорогой]
  verify: [zaliznyak]

- lemma: весёлый
  stress: весёлый
  pos: adj
  zaliznyak: п 1*b
  short_form: true
  comparative: веселе́е
  level: [A1, ТРКИ-1]
  senses:
    - zh: 快活的，愉快的
      en: cheerful
      examples:
        - ru: Э́то был весёлый ве́чер.
