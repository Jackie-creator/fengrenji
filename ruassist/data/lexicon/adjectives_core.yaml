- lemma: умный
  stress: у́мный
  pos: adj
  zaliznyak: п 1*a
  short_form: true
  comparative: умне́е
  level: [A1, ТРКИ-1]
  senses:
    - zh: 聪明的
      en: clever, smart
      examples:
        - ru: Она́ о́чень у́мная де́вушка.
          zh: 她是个很聪明的姑娘。
  notes: |
    短尾阳性有逃逸元音：умён / умна́ / умно́ / умны́。
  verify: [zaliznyak]

- lemma: добрый
  stress: до́брый
  pos: adj
  zaliznyak: п 1*a
  short_form: true
  comparative: добре́е
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 善良的，好心的
      en: kind
      collocations: [до́брое у́тро, до́брый день, до́брый ве́чер]
      examples:
        - ru: Он о́чень до́брый челове́к.
          zh: 他是个很善良的人。
  notes: |
    问候语 До́брое у́тро / До́брый день / До́брый ве́чер 都用这个词，是最高频的固定搭配。
  verify: [zaliznyak]

