- lemma: красный
  stress: кра́сный
  pos: adj
  zaliznyak: п 1*a
  short_form: true
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 红色的
      en: red
      collocations: [Кра́сная пло́щадь]
      examples:
        - ru: Она́ купи́ла кра́сное пла́тье.
          zh: 她买了条红裙子。
  notes: |
    古俄语里 кра́сный 本义是"美丽的"，«Кра́сная пло́щадь»（红场）的原义正是"美丽的广场"。
  verify: [zaliznyak]

- lemma: зелёный
  stress: зелёный
  pos: adj
  zaliznyak: п 1*b
  short_form: true
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 绿色的
      en: green
      examples:
        - ru: Ле́том парк совсе́м зелёный.
          zh: 夏天公园一片绿。
  verify: [zaliznyak]

- lemma: последний
  stress: после́дний
  pos: adj
  zaliznyak: п 4a
  short_form: false
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 最后的；上一个的
      en: last
      collocations: [на про́шлой неде́ле, в после́днее вре́мя]
      examples:
        - ru: Э́то после́дний уро́к.
          zh: 这是最后一课。
  notes: |
    软变化形容词：после́дний / после́дняя / после́днее / после́дние。
    与 си́ний、дома́шний、сосе́дний、ле́тний 同一组。

- lemma: домашний
  stress: дома́шний
  pos: adj
  zaliznyak: п 4a
  short_form: false
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 家里的，家庭的
      en: home, domestic
      collocations: [дома́шнее зада́ние]
      examples:
        - ru: Ты сде́лал дома́шнее зада́ние?
          zh: 你作业做了吗？
  notes: |
    дома́шнее зада́ние 是"作业"的标准说法，口语常简称 дома́шка 或用 уро́ки。

- lemma: китайский
  stress: кита́йский
  pos: adj
  zaliznyak: п 3a*
  short_form: false
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 中国的，汉语的
      en: Chinese
      collocations: [кита́йский язы́к, кита́йская ку́хня]
      examples:
        - ru: Я говорю́ по-кита́йски.
          zh: 我会说汉语。
  common_errors: |
    与 ру́сский 同一套三分：кита́йский язы́к（汉语，形容词）／
    по-кита́йски（用汉语，副词）／ кита́ец, кита́янка（中国人，名词）。
    注意"中国人"不是 кита́йский челове́к。
  verify: [zaliznyak]
