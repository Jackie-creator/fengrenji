# High-frequency verbs of the abstract/discourse layer: sending, leaving,
# proposing, noticing, changing, demanding, permitting, comparing.
#
# These are the verbs that carry B1-B2 written Russian. Almost all of them are
# in productive classes (1, 2, 4, 6), so the engine expands them in full; the
# handful of т -> щ first-person singulars are the only hand-written cells.

- lemma: отправить
  stress: отпра́вить
  pos: verb
  zaliznyak: св 4a
  aspect: perf
  aspect_pair: отправлять
  transitivity: trans
  government: что кому/куда
  level: [B1, ТРКИ-2]
  senses:
    - zh: 寄出，发送，派遣
      en: to send, to dispatch
      examples:
        - ru: Я отпра́вил письмо́ вчера́.
          zh: 我昨天把信寄出去了。

