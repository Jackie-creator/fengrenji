- lemma: оставить
  stress: оста́вить
  pos: verb
  zaliznyak: св 4a
  aspect: perf
  aspect_pair: оставлять
  transitivity: trans
  government: кого-что где
  level: [B1, ТРКИ-2]
  senses:
    - zh: 留下，遗留，丢下
      en: to leave (behind)
      examples:
        - ru: Я оста́вил ключи́ до́ма.
          zh: 我把钥匙落在家里了。
    - zh: 保留，让……保持原样
      en: to keep, to leave as is
      collocations: [оста́вить в поко́е]
      examples:
        - ru: Оста́вьте меня́ в поко́е.
          zh: 别管我。
  common_errors: |
    汉语"留"既能说人也能说物，俄语要分：оста́вить 是"把东西留下"，
    人自己留下来用 оста́ться。«Я оста́вил до́ма» 是错的，应说 «Я оста́лся до́ма»。

