# Work, money, commerce, law and the state.
#
# This is the vocabulary of documents and news, the layer a learner needs to
# read anything official. Case government is noted on the senses that have one,
# because "за что" vs "в чём" is where the mistakes happen, not in the gloss.

- lemma: сотрудник
