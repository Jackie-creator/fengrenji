  animacy: anim
  zaliznyak: м 3a
  level: [B1, ТРКИ-2]
  senses:
    - zh: 职员，同事
      en: employee, colleague
      examples:
        - ru: Он сотру́дник на́шего отде́ла.
          zh: 他是我们部门的职员。

