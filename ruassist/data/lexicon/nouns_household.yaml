# Everyday household objects -- the last gap in the concrete vocabulary.
#
# These are the words a learner needs on day one of actually living somewhere,
# and the ones a travel phrasebook always skips.

- lemma: зонт
  stress: зонт
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1b
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 伞
      en: umbrella
      examples:
        - ru: Возьми́ зонт, идёт дождь.
          zh: 带把伞，下雨了。

- lemma: кошелёк
  stress: кошелёк
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 3*b
  level: [B1, ТРКИ-1]
  senses:
    - zh: 钱包
      en: purse, wallet
      examples:
        - ru: Я потеря́л кошелёк.
          zh: 我钱包丢了。
  notes: |
    间接格里 ё 脱落、л 变软：кошелёк → кошелька́。

