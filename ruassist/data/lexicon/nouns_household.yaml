- lemma: банка
  stress: ба́нка
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 3*a
  level: [B1, ТРКИ-1]
  senses:
    - zh: 罐子，瓶子（玻璃的）
      en: jar, tin
      examples:
        - ru: Он откры́л ба́нку варе́нья.
          zh: 他开了一罐果酱。
  common_errors: |
    ба́нка 是罐、瓶（玻璃或铁的），банк 是银行。差一个字母，意思差很远。

