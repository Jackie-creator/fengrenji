- lemma: шампунь
  stress: шампу́нь
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 2a
  level: [B1, ТРКИ-2]
  senses:
    - zh: 洗发水
      en: shampoo
      examples:
        - ru: Купи́ шампу́нь, пожа́луйста.
          zh: 帮我买瓶洗发水。
  common_errors: |
    是阳性：мой шампу́нь。以 -ь 结尾的词性别要一个个记，不能都当阴性。

- lemma: крем
  stress: крем
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1a
  level: [B1, ТРКИ-2]
  senses:
    - zh: 面霜，护肤霜；奶油
      en: cream
      examples:
        - ru: Она́ ма́жет ру́ки кре́мом.
          zh: 她往手上抹护手霜。

- lemma: замок
  stress: за́мок
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 3*a
  homonym_id: 2
  level: [B2, ТРКИ-2]
  senses:
    - zh: 城堡
      en: castle
      examples:
        - ru: На горе́ стои́т ста́рый за́мок.
          zh: 山上有座老城堡。
  common_errors: |
    за́мок（重音在前）是城堡，замо́к（重音在后）是锁。
    拼写一样，只靠重音区分——俄语里最有名的一对重音辨义词。

