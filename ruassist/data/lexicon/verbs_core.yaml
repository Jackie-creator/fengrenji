- lemma: учиться
  stress: учи́ться
  pos: verb
  zaliznyak: нсв 4c
  aspect: impf
  transitivity: intrans
  reflexive: true
  government: где / чему
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 学习，上学（不带宾语）
      en: to study
      examples:
        - ru: Я учу́сь в университе́те.
          zh: 我在上大学。
  common_errors: |
    учи́ться 不能带第四格宾语。"学俄语"要用 изуча́ть ру́сский язы́к
    或 учи́ть ру́сский язы́к，不能说 учи́ться ру́сский язы́к。

