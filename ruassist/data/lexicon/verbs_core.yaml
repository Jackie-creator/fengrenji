    单数三个形式完全不带常规人称词尾。只有 дать、есть 和它们的派生词这样变。

- lemma: видеть
  stress: ви́деть
  pos: verb
  zaliznyak: нсв 5a
  aspect: impf
  aspect_pair: увидеть
  transitivity: trans
  government: кого-что
  level: [A1, 高考, ТРКИ-1]
  senses:
