  notes: |
    命令式 дава́й / дава́йте 是日常最常用的"来吧、咱们……吧"：
    «Дава́йте начнём» 咱们开始吧。

- lemma: дать
  stress: дать
  pos: verb
  aspect: perf
  aspect_pair: давать
  transitivity: trans
  government: что кому
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    futr,1per,sing: дам
    futr,2per,sing: дашь
    futr,3per,sing: даст
    futr,1per,plur: дади́м
    futr,2per,plur: дади́те
    futr,3per,plur: даду́т
    past,masc: дал
    past,femn: дала́
    past,neut: да́ло
    past,plur: да́ли
    impr,sing: дай
    impr,plur: да́йте
  senses:
    - zh: 给（完成体）
      en: to give
      examples:
        - ru: Да́йте, пожа́луйста, меню́.
