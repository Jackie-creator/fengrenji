- lemma: слышать
  stress: слы́шать
  pos: verb
  zaliznyak: нсв 5a
  aspect: impf
  transitivity: trans
  government: кого-что / о ком-чём
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 听见
      en: to hear
      examples:
        - ru: Я вас пло́хо слы́шу.
          zh: 我听不太清您说话。
  common_errors: |
    与 слу́шать 区分：слы́шать 是"听见"（被动接收），слу́шать 是"听"（主动动作）。
    对应 ви́деть / смотре́ть 的同一组对立。

- lemma: смотреть
  stress: смотре́ть
  pos: verb
  zaliznyak: нсв 5c
  aspect: impf
  aspect_pair: посмотреть
  transitivity: trans
  government: что / на кого-что
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 看，观看
      en: to watch, to look
      collocations: [смотре́ть телеви́зор, смотре́ть фильм, смотре́ть в окно́]
      examples:
        - ru: Ве́чером мы смо́трим телеви́зор.
          zh: 晚上我们看电视。
  common_errors: |
    "看某人／某物"用 смотре́ть на кого́-что（第四格），
    但"看电视／电影"直接接第四格：смотре́ть телеви́зор。两种搭配都要记。

- lemma: посмотреть
