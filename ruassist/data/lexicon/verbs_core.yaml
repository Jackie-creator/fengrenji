- lemma: любить
  stress: люби́ть
  pos: verb
  zaliznyak: нсв 4c
  aspect: impf
  transitivity: trans
  government: кого-что
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 爱；喜欢
      en: to love, to like
      examples:
        - ru: Я люблю́ ру́сскую му́зыку.
          zh: 我喜欢俄罗斯音乐。
  common_errors: |
    第一人称单数有 л 插入音：люблю́，不是 любю́。其余人称没有：лю́бишь / лю́бит / лю́бят。

- lemma: хотеть
  stress: хоте́ть
  pos: verb
  aspect: impf
  transitivity: trans
  government: чего / что / инф.
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    pres,1per,sing: хочу́
    pres,2per,sing: хо́чешь
    pres,3per,sing: хо́чет
    pres,1per,plur: хоти́м
    pres,2per,plur: хоти́те
    pres,3per,plur: хотя́т
    past,masc: хоте́л
    past,femn: хоте́ла
    past,neut: хоте́ло
    past,plur: хоте́ли
  senses:
    - zh: 想，想要
      en: to want
      examples:
        - ru: Я хочу́ пить.
          zh: 我渴了（想喝水）。
        - ru: Что вы хоти́те?
          zh: 您要什么？
  common_errors: |
    хоте́ть 是俄语里唯一的"混合变位"动词：单数按第一变位法（хочу́ / хо́чешь / хо́чет），
    复数按第二变位法（хоти́м / хоти́те / хотя́т），而且单复数重音位置不同。必须整组背。

- lemma: мочь
  stress: мочь
  pos: verb
  zaliznyak: нсв 8c
  aspect: impf
  transitivity: intrans
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    pres,1per,sing: могу́
    pres,2per,sing: мо́жешь
    pres,3per,sing: мо́жет
    pres,1per,plur: мо́жем
    pres,2per,plur: мо́жете
    pres,3per,plur: мо́гут
    past,masc: мог
    past,femn: могла́
    past,neut: могло́
    past,plur: могли́
  senses:
    - zh: 能，可以（体力、条件上做得到）
      en: can, to be able to
      examples:
        - ru: Я не могу́ прийти́ за́втра.
          zh: 我明天来不了。
  common_errors: |
    第一人称和第三人称复数保留 г（могу́ / мо́гут），中间几个变成 ж（мо́жешь / мо́жет）。
    与 уме́ть 区分：мочь 是"条件允许做得到"，уме́ть 是"学会了这项技能"。

- lemma: давать
  stress: дава́ть
  pos: verb
  aspect: impf
  aspect_pair: дать
  transitivity: trans
  government: что кому
  level: [A1, 高考, ТРКИ-1]
  form_overrides:
    pres,1per,sing: даю́
    pres,2per,sing: даёшь
    pres,3per,sing: даёт
    pres,1per,plur: даём
    pres,2per,plur: даёте
    pres,3per,plur: даю́т
    impr,sing: дава́й
    impr,plur: дава́йте
