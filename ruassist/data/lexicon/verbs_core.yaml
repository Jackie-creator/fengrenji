- lemma: работать
  stress: рабо́тать
  pos: verb
  zaliznyak: нсв 1a
  aspect: impf
  transitivity: intrans
  government: кем / где
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 工作
