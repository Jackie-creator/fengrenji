# Core A1 verbs.
#
# Authoring standard for bulk entries: grammar fields are mandatory,
# common_errors only where there is a real trap. The 55-entry sample deliberately
# maxed out the notes; at scale that would bury the content.

- lemma: быть
  stress: быть
  pos: verb
  aspect: impf
  transitivity: intrans
  government: кем-чем
  level: [A1, 高考, ТРКИ-1]
  freq_rank: 2
  form_overrides:
    pres,3per,sing: есть
    futr,1per,sing: бу́ду
    futr,2per,sing: бу́дешь
    futr,3per,sing: бу́дет
    futr,1per,plur: бу́дем
    futr,2per,plur: бу́дете
    futr,3per,plur: бу́дут
    past,masc: был
    past,femn: была́
    past,neut: бы́ло
    past,plur: бы́ли
    impr,sing: будь
    impr,plur: бу́дьте
  senses:
    - zh: 是，在，存在
      en: to be
      examples:
        - ru: Он был до́ма.
          zh: 他当时在家。
        - ru: За́втра я бу́ду свобо́ден.
          zh: 我明天有空。
  common_errors: |
    现在时一般不用系动词：«Я студе́нт» 我是学生，不能说 «Я есть студе́нт»。
    есть 只在表示"有／存在"时出现：«У меня́ есть кни́га»。
    过去时阴性重音在词尾：была́，而 был / бы́ло / бы́ли 在词干。
    否定过去时重音移到 не：«не́ был», «не́ было», «не́ были»，但阴性是 «не была́»。

