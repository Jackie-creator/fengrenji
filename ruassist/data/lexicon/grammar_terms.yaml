- lemma: временно
  stress: вре́менно
  pos: adv
  level: [B2, ТРКИ-2]
  senses:
    - zh: 暂时地
      en: temporarily
      examples:
        - ru: Он вре́менно живёт у дру́га.
          zh: 他暂时住在朋友家。

- lemma: наверх
  stress: наве́рх
  pos: adv
  level: [B1, ТРКИ-2]
  senses:
    - zh: 往上，上楼（方向）
      en: upstairs, up (direction)
      examples:
        - ru: Подними́сь наве́рх.
          zh: 上楼来。
  common_errors: |
    наве́рх 是方向（往上去），наверху́ 是位置（在上面）。
    和 внизу́／вниз 一样，问 куда 用前者，问 где 用后者。

