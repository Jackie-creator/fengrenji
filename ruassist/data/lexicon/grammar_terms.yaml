          zh: 这是家常便饭。

- lemma: заметный
  stress: заме́тный
  pos: adj
  zaliznyak: п 1*a
  level: [B2, ТРКИ-3]
  senses:
    - zh: 明显的，看得出来的
      en: noticeable
      examples:
        - ru: Разни́ца заме́тна.
          zh: 差别看得出来。

- lemma: незаметный
  stress: незаме́тный
  pos: adj
  zaliznyak: п 1*a
  level: [B2, ТРКИ-3]
  senses:
    - zh: 不显眼的
      en: imperceptible, inconspicuous
      examples:
        - ru: Он оста́лся незаме́тным.
