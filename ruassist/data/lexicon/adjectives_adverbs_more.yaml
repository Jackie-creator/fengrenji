    - zh: 冷（无人称）
      en: (it is) cold
      government: кому
      examples:
        - ru: Мне хо́лодно.
          zh: 我冷。
  common_errors: |
    "我冷"是 Мне хо́лодно——人用**第三格**，句子没有主语。
    说成 «Я холо́дный» 意思变成"我这个人是冷的（性格冷淡／身体是凉的）"。
    жа́рко、тепло́、ску́чно、сты́дно 全套都这样。

