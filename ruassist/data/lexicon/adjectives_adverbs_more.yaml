# Weather and evaluation adjectives, the impersonal predicatives, and the
# interjections.
#
# The predicatives are the reason this file exists. Russian says "мне хо́лодно"
# where Chinese says 我冷 -- no subject, the person in the dative, and the word
# itself is neither adjective nor adverb. A learner who files хо́лодно under
# "adverb of холо́дный" will keep producing «я хо́лодный».

- lemma: солнечный
  stress: со́лнечный
  pos: adj
  zaliznyak: п 1*a
  level: [A2, 高考, ТРКИ-1]
  senses:
    - zh: 晴的，阳光的
      en: sunny
      examples:
        - ru: Сего́дня со́лнечный день.
          zh: 今天是个晴天。
  antonyms: [пасмурный]

