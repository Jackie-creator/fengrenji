# Abstract nouns I: mind, feeling, character, judgement.
#
# This is the layer that separates "can order coffee" from "can read an
# article". Almost all of it is -ие/-ость/-ство morphology, which is regular;
# the entries are short on purpose -- an abstract noun needs a precise gloss
# and one clear example, not four senses.

- lemma: ум
  stress: ум
  pos: noun
  gender: masc
  animacy: inan
  zaliznyak: м 1b
  level: [B1, ТРКИ-2]
  senses:
    - zh: 智力，头脑
      en: mind, intellect
      collocations: [сойти́ с ума́]
      examples:
        - ru: У него́ о́стрый ум.
          zh: 他脑子很灵。
  notes: |
    сойти́ с ума́ = 发疯，口语里也表示"疯了吧"的惊讶。

