- lemma: мечта
  stress: мечта́
  pos: noun
  gender: femn
  animacy: inan
  zaliznyak: ж 1b
  level: [B1, ТРКИ-2]
  form_overrides:
    plur,gent: мечта́ний
  senses:
    - zh: 梦想，愿望
      en: dream, aspiration
      examples:
        - ru: Э́то мечта́ всей жи́зни.
          zh: 这是一生的梦想。
  common_errors: |
    мечта́ 是"理想、渴望"，睡觉做的梦是 сон。汉语一个"梦"，俄语两个词。
    复数第二格是 мечта́ний（不是 *мечт），这一格要单独记。

