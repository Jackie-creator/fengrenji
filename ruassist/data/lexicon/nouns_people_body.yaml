# People: family, ages, professions; the body; clothing.
#
# Kinship is where Chinese is far more specific than Russian (哥哥/弟弟 are both
# брат), and profession names are where Russian is more specific than Chinese
# (учи́тель / учи́тельница). Both directions are noted where they bite.

- lemma: бабушка
  stress: ба́бушка
  pos: noun
  gender: femn
  animacy: anim
  zaliznyak: ж 3*a
  level: [A1, 高考, ТРКИ-1]
  senses:
    - zh: 奶奶，外婆
      en: grandmother
      examples:
        - ru: Ба́бушка живёт в дере́вне.
          zh: 奶奶住在乡下。
  common_errors: |
    俄语不分父系母系：爷爷、外公都是 де́душка，奶奶、外婆都是 ба́бушка。
    要说清楚得加 по отцу́／по ма́тери。

