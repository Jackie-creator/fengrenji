[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruassist"
version = "0.1.0"
description = "Offline Russian-Chinese dictionary and learning toolkit"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pymorphy3>=2.0",   # cross-checks generated forms against OpenCorpora
]

[project.scripts]
ruassist = "ruassist.cli:main"
ruassist-validate = "ruassist.validate:main"
ruassist-coverage = "ruassist.coverage:main"
ruassist-crosscheck = "ruassist.crosscheck:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
