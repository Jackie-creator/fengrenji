[project]
name = "leatherpattern-backend"
version = "0.1.0"
description = "LeatherPattern AI - parametric leather cutting pattern generator"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0",
    "svgwrite>=1.4",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
